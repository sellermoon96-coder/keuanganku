    simpanLokal();
    info = "Semua transaksi berhasil dikosongkan. Master Akun dan SKU tetap tersimpan.";
    S.tab = "dash";
    draw();
  };
}

function st() {
  const T = S.set || "akun";
  const tb = [
    ["akun", "Daftar Akun (COA)"],
    ["kat", "Kategori & Arus Kas"],
    ["sku", "Katalog SKU Barang"]
  ];
  const ko = c => KATS.map(k => `<option value="${esc(k.kat)}" ${k.kat == c ? "selected" : ""}>${esc(k.kat)}</option>`).join("");
  let b = `<div class="bar">${tb.map(t => `<button type="button" class="btn${T == t[0] ? "" : " alt"}" data-st="${t[0]}">${t[1]}</button>`).join("")}</div>`;

  if (T == "akun") {
    const aq = (S.akunQ || "").toLowerCase();
    const listAkun = [...AKUN]
      .sort((x, y) => x.kode.localeCompare(y.kode))
      .filter(a => !aq || (a.kode + " " + a.nama + " " + a.kat).toLowerCase().includes(aq));

    b += `<div class="panel">
      <h2>Tambah Akun Baru</h2>
      <div class="form">
        <label>Nomor Akun<input id="a-kode" placeholder="6-60999"></label>
        <label>Nama Akun<input id="a-nama" placeholder="Biaya Endorse"></label>
        <label>Kategori<select id="a-kat">${ko("")}</select></label>
        <button class="btn" id="a-add" type="button">+ Tambah Akun</button>
      </div>
      <div id="a-err" class="neg" role="alert" style="margin-top:6px"></div>
    </div>
    <div class="panel scroll">
      <h2>
        <span>Daftar Akun (${listAkun.length} dari ${AKUN.length})</span>
        <input id="a-cari" placeholder="Cari kode, nama akun, atau kategori…" value="${esc(S.akunQ)}" style="font-weight:400;width:260px">
      </h2>
      <table id="tbl-setup-akun">
        <thead><tr><th>Nomor Akun</th><th>Nama Akun</th><th>Kategori</th><th>Aksi</th></tr></thead>
        <tbody>${listAkun
          .map(a => {
            const isEd = S.editAkun === a.kode;
            return `<tr>
              <td><code>${esc(a.kode)}</code></td>
              <td style="text-align:left">${
                isEd
                  ? `<input id="ea-nama" value="${esc(a.nama)}" style="width:100%;min-width:220px">`
                  : `<b>${esc(a.nama)}</b>`
              }</td>
              <td style="text-align:left">${
                isEd
                  ? `<select id="ea-kat">${ko(a.kat)}</select>`
                  : `<span class="badge ok">${esc(a.kat)}</span>`
              }</td>
              <td>${
                isEd
                  ? `<button type="button" class="btn sm" data-asave="${esc(a.kode)}">Simpan</button> <button type="button" class="btn alt sm" data-acancel="1">Batal</button>`
                  : `<button type="button" class="btn alt sm" data-aedit="${esc(a.kode)}">Ubah</button> ` +
                    (TETAP.includes(a.kode)
                      ? `<span class="badge ok" title="Digunakan oleh sistem jurnal otomatis">Sistem</span>`
                      : `<button type="button" class="x" data-ad="${esc(a.kode)}">Hapus</button>`)
              }</td>
            </tr>`;
          })
          .join("")}</tbody>
      </table>
    </div>`;
  }

  if (T == "kat") {
    b += `<div class="panel scroll">
      <h2>Kategori Akun dan Pemetaan Arus Kas</h2>
      <table id="tbl-setup-kat">
        <thead><tr><th>Kategori Akun</th><th>Kategori Arus Kas</th><th>Saldo Normal</th><th>Jumlah Akun</th></tr></thead>
        <tbody>${KATS.map(
          (k, i) => `<tr>
            <td><b>${esc(k.kat)}</b></td>
            <td style="text-align:left"><input data-ka="${i}" value="${esc(k.arus)}" style="width:230px"></td>
            <td><select data-kn="${i}"><option ${k.normal == "DEBET" ? "selected" : ""}>DEBET</option><option ${k.normal == "KREDIT" ? "selected" : ""}>KREDIT</option></select></td>
            <td>${AKUN.filter(a => a.kat == k.kat).length}</td>
          </tr>`
        ).join("")}</tbody>
      </table>
    </div>`;
  }

  if (T == "sku") {
    const d = new Set(), dup = SKUS.filter(x => d.has(x.sku) || !d.add(x.sku)).map(x => x.sku);
    const sq = (S.skuQ || "").toLowerCase();
    const listSku = SKUS.map((x, idx) => ({ ...x, idx })).filter(
      x => !sq || (x.sku + " " + x.nama).toLowerCase().includes(sq)
    );

    b += `<div class="panel">
      <h2>Tambah Master SKU Barang</h2>
      <div class="form">
        <label>Kode SKU<input id="k-sku" placeholder="MS-NEW"></label>
        <label>Nama Barang<input id="k-nama" placeholder="Nama lengkap produk"></label>
        <button class="btn" id="k-add" type="button">+ Tambah SKU</button>
      </div>
      <div id="k-err" class="neg" role="alert" style="margin-top:6px"></div>
      ${dup.length ? `<p class="neg">Catatan: Ada kode SKU ganda di daftar (${esc([...new Set(dup)].join(", "))}).</p>` : ""}
    </div>
    <div class="panel scroll">
      <h2>
        <span>Master SKU Barang (${listSku.length} dari ${SKUS.length})</span>
        <input id="k-cari" placeholder="Ketik SKU atau nama barang…" value="${esc(S.skuQ)}" style="font-weight:400;width:250px">
      </h2>
      <table id="tbl-setup-sku">
        <thead><tr><th>Kode SKU</th><th>Nama Barang</th><th>Aksi</th></tr></thead>
        <tbody>${listSku
          .map(x => {
            const isEd = S.editSku === x.idx;
            return `<tr>
              <td><b>${esc(x.sku)}</b></td>
              <td style="text-align:left">${
                isEd
                  ? `<input id="es-nama" value="${esc(x.nama)}" style="width:100%;min-width:260px">`
                  : esc(x.nama)
              }</td>
              <td>${
                isEd
                  ? `<button type="button" class="btn sm" data-ssave="${x.idx}">Simpan</button> <button type="button" class="btn alt sm" data-scancel="1">Batal</button>`
                  : `<button type="button" class="btn alt sm" data-sedit="${x.idx}">Ubah</button> <button type="button" class="x" data-sd="${x.idx}">Hapus</button>`
              }</td>
            </tr>`;
          })
          .join("")}</tbody>
      </table>
    </div>`;
  }
  return b;
}

function bindT() {
  document.querySelectorAll("#app [data-st]").forEach(b => {
    b.onclick = () => {
      S.set = b.dataset.st;
      S.editAkun = null;
      S.editSku = null;
      draw();
    };
  });

  const er = (id, t) => {
    const el = document.getElementById(id);
    if (el) el.textContent = t;
  };
  const T = S.set || "akun";
  const g = id => document.getElementById(id);

  if (T == "akun") {
    const btnAdd = g("a-add");
    if (btnAdd) {
      btnAdd.onclick = () => {
        const k = g("a-kode").value.trim(), n = g("a-nama").value.trim(), c = g("a-kat").value;
        if (!/^\d-\d{5}$/.test(k)) return er("a-err", "Nomor akun harus berformat seperti 6-60999.");
        if (!n) return er("a-err", "Isi nama akun.");
        if (AKUN.some(a => a.kode == k)) return er("a-err", "Nomor akun " + k + " sudah ada.");
        if (KD[c] != k[0]) return er("a-err", "Kategori " + c + " harus berawalan " + KD[c] + "-.");
        AKUN.push({ kode: k, nama: n, kat: c });
        rebuildAK();
        simpanLokal();
        info = "Akun " + k + " (" + n + ") berhasil ditambahkan.";
        draw();
      };
    }

    const inpCari = g("a-cari");
    if (inpCari) {
      inpCari.oninput = e => {
        S.akunQ = e.target.value;
        const pos = inpCari.selectionStart;
        draw();
        const el = g("a-cari");
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      };
    }

    const tblAkun = g("tbl-setup-akun");
    if (tblAkun) {
      tblAkun.onclick = ev => {
        const btn = ev.target.closest("button");
        if (!btn) return;
        if (btn.dataset.aedit) {
          S.editAkun = btn.dataset.aedit;
          draw();
        } else if (btn.dataset.acancel) {
          S.editAkun = null;
          draw();
        } else if (btn.dataset.asave) {
          const kd = btn.dataset.asave;
          const nmVal = g("ea-nama")?.value.trim();
          const ktVal = g("ea-kat")?.value;
          if (ktVal && KD[ktVal] != kd[0]) {
            info = "Kategori " + ktVal + " harus berawalan " + KD[ktVal] + "-, jadi kategori akun " + kd + " tidak diubah.";
            draw();
            return;
          }
          AKUN = AKUN.map(a => (a.kode == kd ? { ...a, nama: nmVal || a.nama, kat: ktVal || a.kat } : a));
          S.editAkun = null;
          rebuildAK();
          simpanLokal();
          draw();
        } else if (btn.dataset.ad) {
          const k = btn.dataset.ad;
          if (semua().some(j => (j.lines || []).some(l => l.akun == k))) {
            info = "Akun " + k + " sudah dipakai di jurnal, sehingga tidak bisa dihapus.";
            draw();
            return;
          }
          AKUN = AKUN.filter(a => a.kode != k);
          rebuildAK();
          simpanLokal();
          draw();
        }
      };
    }
  }

  if (T == "kat") {
    const tblKat = g("tbl-setup-kat");
    if (tblKat) {
      tblKat.onchange = ev => {
        const t = ev.target;
        if (t.dataset.ka != null) {
          const idx = +t.dataset.ka;
          if (KATS[idx]) KATS[idx].arus = t.value.trim() || KATS[idx].arus;
          simpanLokal();
        } else if (t.dataset.kn != null) {
          const idx = +t.dataset.kn;
          if (KATS[idx]) KATS[idx].normal = t.value;
          simpanLokal();
        }
      };
    }
  }

  if (T == "sku") {
    const btnAddSku = g("k-add");
    if (btnAddSku) {
      btnAddSku.onclick = () => {
        const k = g("k-sku").value.trim(), n = g("k-nama").value.trim();
        if (!k || !n) return er("k-err", "Isi kode SKU dan nama barang.");
        if (SKUS.some(x => x.sku.toLowerCase() == k.toLowerCase())) return er("k-err", "SKU " + k + " sudah ada.");
        SKUS.push({ sku: k, nama: n });
        simpanLokal();
        info = "SKU " + k + " berhasil ditambahkan.";
        draw();
      };
    }

    const inpCariSku = g("k-cari");
    if (inpCariSku) {
      inpCariSku.oninput = e => {
        S.skuQ = e.target.value;
        const pos = inpCariSku.selectionStart;
        draw();
        const el = g("k-cari");
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      };
    }

    const tblSku = g("tbl-setup-sku");
    if (tblSku) {
      tblSku.onclick = ev => {
        const btn = ev.target.closest("button");
        if (!btn) return;
        if (btn.dataset.sedit != null) {
          S.editSku = +btn.dataset.sedit;
          draw();
        } else if (btn.dataset.scancel) {
          S.editSku = null;
          draw();
        } else if (btn.dataset.ssave != null) {
          const idx = +btn.dataset.ssave;
          const nmVal = g("es-nama")?.value.trim();
          if (SKUS[idx] && nmVal) SKUS[idx].nama = nmVal;
          S.editSku = null;
          simpanLokal();
          draw();
        } else if (btn.dataset.sd != null) {
          SKUS.splice(+btn.dataset.sd, 1);
          S.editSku = null;
          simpanLokal();
          draw();
        }
      };
    }
  }
}

function draw() {
  nav();
  const a = document.getElementById("app");
  const T = { dash, lap, jurnal: jr, jual, hp, inv, beli, setup: st, data: dat };
  const B = { dash: bindP, lap: bindL, jurnal: bindJ, jual: bindS, hp: bindH, inv: bindV, beli: bindB, setup: bindT, data: bindD };
  try {
    a.innerHTML =
      banner() +
      (T[S.tab] || dash)() +
      (S.tab == "data" ? "" : '<p id="gd-wrap"><button class="x" id="gd" type="button" style="color:var(--ac)">⚙️ Kelola Cadangan Data &amp; Reset Database</button></p>');
    (B[S.tab] || bindP)();
  } catch (err) {
    console.error("Render error:", err);
  }
  const g = document.getElementById("gd");
  if (g) g.onclick = () => { S.tab = "data"; draw(); };
}

function mulai() {
  const savedTheme = localStorage.getItem("ktoko_theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

  document.getElementById("btn-theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("ktoko_theme", next);
  };
  document.getElementById("btn-demo").onclick = mintaDemo;
  document.getElementById("btn-backup").onclick = () => { S.tab = "data"; draw(); };

  const ada = muatLokal();
  rebuildAK();
  setStatus("Menghubungkan ke Firebase Firestore…");
  draw();
  sambungOnline().then(ok => {
    if (!ok) {
      setStatus("Mode offline · data lokal", true);
      if (!ada || (P.length === 0 && JR.length === 0)) muatDataDemo(true);
    }
    draw();
  });
}

mulai();
</script>
