<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuangan Usaha Elzamora</title>
</head>
<body>

    <!-- Konten website Anda yang sudah ada -->
    <div style="text-align: center; margin-top: 50px;">
        <h1>Keuangan Usaha Elzamora</h1>
        <p>Aplikasi terhubung dengan Firebase!</p>
        <button id="testBtn">Simpan Data Uji Coba</button>
    </div>

    <!-- Script Firebase & Logika Database -->
    <script type="module">
        // 1. Import fungsi yang dibutuhkan dari Firebase SDK (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        
        // (Opsional) Import Firestore jika Anda ingin menyimpan data keuangan ke database Firestore
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. Konfigurasi Firebase milik Anda
        const firebaseConfig = {
            apiKey: "AIzaSyD_BlrzmpWNx2jYlJ9Pk_RVxy74J3dfJzY",
            authDomain: "keuanganku-6fa95.firebaseapp.com",
            databaseURL: "https://keuanganku-6fa95-default-rtdb.firebaseio.com",
            projectId: "keuanganku-6fa95",
            storageBucket: "keuanganku-6fa95.firebasestorage.app",
            messagingSenderId: "142443066397",
            appId: "1:142443066397:web:c606026aff960ea2cd42f4",
            measurementId: "G-H091SE5KY5"
        };

        // 3. Inisialisasi Firebase & Analytics
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        
        // Inisialisasi Firestore (jika ingin pakai database dokumen)
        const db = getFirestore(app);

        console.log("Firebase berhasil diinisialisasi pada website!");

        // 4. Contoh tombol interaktif untuk mengirim data uji coba ke Firestore
        const testBtn = document.getElementById("testBtn");
        if (testBtn) {
            testBtn.addEventListener("click", async () => {
                try {
                    const docRef = await addDoc(collection(db, "catatan_keuangan"), {
                        keterangan: "Tes Koneksi Pertama",
                        nominal: 100000,
                        waktu: new Date()
                    });
                    alert("Berhasil menyimpan data dengan ID: " + docRef.id);
                } catch (e) {
                    console.error("Gagal menyimpan data: ", e);
                    alert("Terjadi kesalahan saat menyimpan data.");
                }
            });
        }
    </script>
</body>
</html>
