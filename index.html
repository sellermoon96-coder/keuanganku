.btn.alt {

  color: var(--ink);
  border: 1px solid var(--ln);
}
.btn.alt:hover { border-color: var(--ac); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }

  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.kpi {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: "";

  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--ac);

.kpi span { font-size: 12px; color: var(--mut); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }

.panel {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);

h2 {

  margin: 0 0 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;

.grid2 {

  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));

  width: 100%;
  font-size: 13.5px;
}

  font-size: 12px;

.neg { color: var(--neg); }
.pos { color: var(--pos); }
.warn { color: var(--warn); }

  padding: 2px 8px;

.empty { color: var(--mut); padding: 18px 0; text-align: center; font-style: italic; }

.db .hb {

  font-size: 16px;

.db .dn {
  text-align: center;
  font-style: italic;
  font-size: 11.5px;
  color: var(--mut);
  padding: 6px 0 2px;
}
.db .dv {
  text-align: center;
  font-size: clamp(23px, 2.8vw, 33px);

  padding: 8px 10px;

function syncOnline() {
  clearTimeout(tmrSync);
  if (!DB) return;
  setStatus("Menyimpan ke online…");
  tmrSync = setTimeout(async () => {
    try {
      const o = DOCS();
      for (const path in o) {
        const j = JSON.stringify(o[path]);
        if (SYNC[path] === j) continue;
        const parts = path.split("/");
        await dbFirestore.collection(parts[0]).doc(parts[1]).set(o[path]);
        SYNC[path] = j;
      }
      setStatus("Tersambung · data tersimpan online (" + new Date().toLocaleTimeString("id-ID") + ")");

function terapkanDoc(path, d) {
  const j = JSON.stringify(d);

  else if (a[1] == "jr") JR = d.d || [];
  else if (a[1] == "inv") INV = d.d || [];
  else if (a[1] == "be") BE = d.d || [];
  else if (a[1] == "hp") HP = d.d || [];
  else if (a[1] == "ca") CA = d.d || [];
  else if (a[1] == "op") OP = d.d || [];
  else if (a[1] == "setup") { if (d.akun && d.akun.length) AKUN = d.akun; if (d.kats && d.kats.length) KATS = d.kats; if (d.skus && d.skus.length) SKUS = d.skus; }

}

function HPPM() {
  const ev = [], c = {}, opVal = {}, st = {};
  INV.forEach(i => { st[i.sku] = { q: i.stok, v: i.stok * i.hrg, l: i.hrg }; });
  BE.forEach(b => ev.push({ t: 0, tgl: b.tgl, sku: b.sku, q: b.jml, v: b.jml * b.hrg }));
  P.forEach(p => ev.push({ t: 1, tgl: p.tgl, sku: p.sku, q: p.jml, k: (p.toko || "java") + "|" + p.tgl + "|" + p.no + "|" + p.sku }));
  OP.forEach(o => ev.push({ t: 2, tgl: o.tgl, sku: o.sku, diff: o.diff, id: o.id }));
  ev.sort((a, b) => a.tgl.localeCompare(b.tgl) || a.t - b.t).forEach(e => {
    const x = st[e.sku];
    if (!x) return;
    if (e.t == 0) { x.q += e.q; x.v += e.v; x.l = x.q > 0 ? x.v / x.q : x.l; }
    else if (e.t == 1) {
      const av = x.q > 0 ? x.v / x.q : x.l;
      const k = e.q * av;
      c[e.k] = k;
      x.q -= e.q; x.v -= k;
      if (x.q > 0) x.l = x.v / x.q;
    } else if (e.t == 2) {
      const av = x.q > 0 ? x.v / x.q : x.l;
      const dv = e.diff * av;
      opVal[e.id] = dv;
      x.q += e.diff; x.v += dv;
      if (x.q > 0) x.l = x.v / x.q;
    }
  });
  return { c, opVal, st };
}

function JA() {
  const E = [], d = {}, H = HPPM(), HC = H.c, HV = H.opVal;
  P.forEach(p => { const tk = p.toko || "java"; const key = p.tgl + "|" + tk; (d[key] = d[key] || []).push(p); });
  Object.keys(d).sort().forEach(key => {
    const [tg, tk] = key.split("|");
    const L = { "1-10100": { akun: "1-10100", d: 0, k: 0 } };
    const add = (k, x, y) => { if (x || y) { const o = (L[k] = L[k] || { akun: k, d: 0, k: 0 }); o.d += x; o.k += y; } };
    let net = 0, hp = 0;
    d[key].forEach(p => {

      const g = p.hrg * p.jml, v = p.vc || 0, a = p.adm || 0;
      add(ak[1], a, 0); add(ak[2], v, 0); add(ak[0], 0, g);
      net += g - v - a;
      hp += HC[tk + "|" + p.tgl + "|" + p.no + "|" + p.sku] || 0;
    });
    L["1-10100"].d = net;
    add("5-50300", hp, 0); add("1-10200", 0, hp);
    const kdPiutang = kodePiutangToko(tk, tg);
    E.push({ id: "~j" + tg + "_" + tk, auto: 1, toko: tk, net, tgl: tg, ket: "Penjualan Shopee " + labelToko(tk) + " harian " + tg + " (otomatis)", ref: { tipe: "piutang", no: kdPiutang }, lines: Object.values(L).filter(l => l.d || l.k) });
  });
  BE.forEach(b => E.push({ id: "~b" + b.id, auto: 1, tgl: b.tgl, ket: "Pembelian " + b.sku + (b.toko ? " di " + b.toko : "") + " (otomatis)", lines: [{ akun: "1-10200", d: b.jml * b.hrg, k: 0 }, { akun: b.bayar || "1-10003", d: 0, k: b.jml * b.hrg }] }));
  HP.forEach(h => (h.log || []).forEach((x, i) => E.push({ id: "~h" + h.id + i, auto: 1, tgl: x.tgl, ket: (h.tipe == "hutang" ? "Bayar hutang " : "Terima piutang ") + h.no + " " + h.pihak + " (otomatis)", ref: { tipe: h.tipe, no: h.no }, lines: h.tipe == "hutang" ? [{ akun: h.akun || "2-20100", d: x.nom, k: 0 }, { akun: x.akun, d: 0, k: x.nom }] : [{ akun: x.akun, d: x.nom, k: 0 }, { akun: h.akun || "1-10100", d: 0, k: x.nom }] })));
  HP.forEach(h => { if (h.lawan) E.push({ id: "~k" + h.id, auto: 1, tgl: h.tgl, ket: "Pencatatan " + (h.tipe == "hutang" ? "hutang " : "piutang ") + h.no + " " + h.pihak + " (otomatis)", ref: { tipe: h.tipe, no: h.no }, lines: h.tipe == "hutang" ? [{ akun: h.lawan, d: h.nom, k: 0 }, { akun: h.akun, d: 0, k: h.nom }] : [{ akun: h.akun, d: h.nom, k: 0 }, { akun: h.lawan, d: 0, k: h.nom }] }); });
  const mapCairRef = hitungAlokasiCair();
  CA.forEach(c => {
    const tk = c.toko || (c.kode && c.kode.includes("-KONG-") ? "kong" : "java");
    const kdRef = c.kode || mapCairRef[c.id] || kodePiutangToko(tk, c.tgl);
    E.push({ id: "~c" + c.id, auto: 1, toko: tk, tgl: c.tgl, ket: "Pencairan dana Shopee " + labelToko(tk) + " — " + kdRef + " (otomatis)", ref: { tipe: "piutang", no: kdRef }, lines: [{ akun: c.akun, d: c.nom, k: 0 }, { akun: "1-10100", d: 0, k: c.nom }] });
  });
  OP.forEach(o => {
    const val = Math.round(HV[o.id] ?? o.diff * (o.hrg || 0));
    if (!val) return;
    const absVal = Math.abs(val);
    E.push({ id: "~op" + o.id, auto: 1, tgl: o.tgl, ket: "Rekonsiliasi Stock Opname " + o.sku + " (Buku: " + o.buku + " → Aktual: " + o.aktual + ") (otomatis)", lines: val > 0 ? [{ akun: "1-10200", d: absVal, k: 0 }, { akun: "5-50204", d: 0, k: absVal }] : [{ akun: "5-50204", d: absVal, k: 0 }, { akun: "1-10200", d: 0, k: absVal }] });
  });
  return E;
}

function hitungAlokasiCair() {
  const M = {};
  P.forEach(p => {
    const tk = p.toko || "java";
    const kd = kodePiutangToko(tk, p.tgl);
    const x = (M[kd] = M[kd] || { kode: kd, toko: tk, bln: p.tgl.slice(0, 7), net: 0, bayar: 0 });
    x.net += p.hrg * p.jml - (p.vc || 0) - (p.adm || 0);
  });
  const list = Object.values(M).sort((a, b) => a.bln.localeCompare(b.bln) || a.kode.localeCompare(b.kode));
  const refMap = {};
  [...CA].sort((a, b) => a.tgl.localeCompare(b.tgl)).forEach(c => {
    const tk = c.toko || (c.kode && c.kode.includes("-KONG-") ? "kong" : "java");
    if (c.kode && M[c.kode]) { refMap[c.id] = c.kode; M[c.kode].bayar += c.nom; }
    else {
      const kandidat = list.find(x => x.toko == tk && x.net - x.bayar > 0) || list.find(x => x.toko == tk);
      if (kandidat) { refMap[c.id] = kandidat.kode; kandidat.bayar += c.nom; }
      else { refMap[c.id] = kodePiutangToko(tk, c.tgl); }
    }
  });
  return refMap;
}

function PS() {
  const M = {};
  JA().filter(e => e.net != null).sort((a, b) => a.tgl.localeCompare(b.tgl) || a.ref.no.localeCompare(b.ref.no)).forEach(e => {
    const tk = e.toko || (e.ref.no.includes("-KONG-") ? "kong" : "java");
    const x = (M[e.ref.no] = M[e.ref.no] || { kode: e.ref.no, toko: tk, bln: e.tgl.slice(0, 7), net: 0, bayar: 0 });
    x.net += e.net;
  });
  const L = Object.values(M).sort((a, b) => a.bln.localeCompare(b.bln) || a.kode.localeCompare(b.kode));
  let lebih = 0;
  const lebihToko = { java: 0, kong: 0 };
  const sisaCairToko = {};
  [...CA].sort((a, b) => a.tgl.localeCompare(b.tgl)).forEach(c => {
    const tk = c.toko || (c.kode && c.kode.includes("-KONG-") ? "kong" : "java");
    if (c.kode && M[c.kode]) {
      const x = M[c.kode];
      const ruang = Math.max(0, x.net - x.bayar);
      const pakai = Math.min(ruang, c.nom);
      x.bayar += pakai;
      const sisa = c.nom - pakai;
      if (sisa > 0) sisaCairToko[tk] = (sisaCairToko[tk] || 0) + sisa;
    } else { sisaCairToko[tk] = (sisaCairToko[tk] || 0) + c.nom; }
  });
  Object.keys(sisaCairToko).forEach(tk => {
    let t = sisaCairToko[tk] || 0;
    L.filter(x => x.toko == tk).forEach(x => {
      const ruang = Math.max(0, x.net - x.bayar);
      const u = Math.min(t, ruang);
      x.bayar += u; t -= u;
    });
    if (t > 0) { lebih += t; lebihToko[tk] = (lebihToko[tk] || 0) + t; }
  });
  return { L, lebih, lebihToko };
}

function kas(ms) {
  let m = 0, k = 0;
  semua().forEach(j => {
    const d = dt(j.tgl);
    if (d.getFullYear() != S.thn || !ms.includes(d.getMonth())) return;
    (j.lines || []).forEach(l => {
      if (KAS.some(a => a[0] == l.akun)) { m += l.d || 0; k += l.k || 0; }
    });
  });
  return { m, k };
}

function hitung() {
  const r = {};
  const a = (k, m, v) => { if (v) (r[k] = r[k] || Array(12).fill(0))[m] += v; };
  for (const j of semua()) {
    const d = dt(j.tgl);
    if (d.getFullYear() != S.thn) continue;
    const m = d.getMonth();
    (j.lines || []).forEach(l => {
      const g = grup(l.akun);
      if (g == "P") a(l.akun, m, (l.k || 0) - (l.d || 0));
      else if (g == "H" || g == "B") a(l.akun, m, (l.d || 0) - (l.k || 0));
    });
  }
  return r;
}

function jumlah(r, g, ms) {
  let s = 0;
  for (const k in r) if (grup(k) == g) ms.forEach(m => (s += r[k][m]));
  return s;
}

  a.forEach((v, i) => {

function cDonut(pl, tp) {
  const C = 2 * Math.PI * 70;
  const top = pl.reduce((x, y) => (y[1] > x[1] ? y : x), pl[0]);
  let off = 0, g = "", lb = "";
  pl.forEach((p, i) => {
    const l = tp ? (p[1] / tp) * C : 0;
    if (l > 0) {
      g += `<circle r="70" fill="none" stroke="${WP[i]}" stroke-width="38" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}"/>`;
      const an = ((off + l / 2) / C) * 2 * Math.PI - Math.PI / 2;
      const pct = Math.round((p[1] / tp) * 100);
      if (pct >= 5) lb += `<text x="${150 + 70 * Math.cos(an)}" y="${115 + 70 * Math.sin(an) + 4}" text-anchor="middle" style="fill:#fff;font-weight:700">${pct}%</text>`;
      off += l;
    }
  });
  if (!tp) g = `<circle r="70" fill="none" stroke="var(--ln)" stroke-width="38"/>`;
  return `<svg viewBox="0 0 300 230" width="100%" style="max-width:340px"><g transform="translate(150,115) rotate(-90)">${g}</g>${lb}<text x="150" y="104" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">${tp ? esc(top[0]) : "Belum ada data"}</text><text x="150" y="117" text-anchor="middle" style="font-size:8.5px">(Satuan Juta Rupiah)</text><text x="150" y="142" text-anchor="middle" style="fill:var(--ink);font-size:24px;font-weight:800">${tp ? (top[1] / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) : "0"}</text></svg>`;
}

function cPie(a, b) {
  const t = a + b;
  if (!t) return '<div class="empty">Belum ada beban.</div>';
  const R = 86, f = a / t, e = 2 * Math.PI * f - Math.PI / 2;
  const x = 105 + R * Math.cos(e), y = 105 + R * Math.sin(e), big = f > 0.5 ? 1 : 0;
  return `<svg viewBox="0 0 210 210" width="100%" style="max-width:200px">${!b ? `<circle cx="105" cy="105" r="${R}" fill="#12ab92"/>` : !a ? `<circle cx="105" cy="105" r="${R}" fill="#f26b3a"/>` : `<path d="M105 105 L105 ${105 - R} A${R} ${R} 0 ${big} 1 ${x} ${y} Z" fill="#12ab92"/><path d="M105 105 L${x} ${y} A${R} ${R} 0 ${1 - big} 1 105 ${105 - R} Z" fill="#f26b3a"/>`}</svg>`;
}

function dash() {
  const r = hitung();
  const ms = S.bln == "ytd" ? [...Array(12).keys()] : [+S.bln];

  const mo = g => al.map(m => jumlah(r, g, [m]));
  const pd = mo("P"), hp = mo("H"), bb = mo("B");

  const va = (k1, k2) => al.map(m => (r[k1] ? r[k1][m] : 0) + (r[k2] ? r[k2][m] : 0));
  const vo = al.map(m => -((r["4-40600"] ? r["4-40600"][m] : 0) + (r["4-40700"] ? r["4-40700"][m] : 0)));
  const ad = va("6-60300", "6-60302");
  const rev = sm(pd), hpp = sm(hp), beb = sm(bb), exp = hpp + beb, laba = rev - exp;
  const c = kas(ms);
  const cur = S.bln == "ytd" ? pd.map((v, i) => (v ? i : -1)).filter(i => i >= 0).pop() : +S.bln;

  const mm = cur >= 0 && pv ? ((pd[cur] - pv) / pv) * 100 : null;

  const lm = rev ? (laba / rev) * 100 : null;
  const pf = v => (v == null ? "–" : v.toFixed(0) + "%");
  const hij = "#12ab92", mrh = "#d0021b";

  const pl = AK.P.a.slice(0, 4).map(a => [a[1].replace("Penjualan ", ""), ms.reduce((s, m) => s + (r[a[0]] ? r[a[0]][m] : 0), 0)]);
  const tp = pl.reduce((s, x) => s + x[1], 0);
  const th = daftarTahun();

  const kt = (j, n, v, l, rt, wr) => `<div class="dc"><div class="dh"><span>${j}</span><i></i></div><div class="dn">(Angka dalam satuan rupiah)</div><div class="dv">${v}</div><div class="df"><span>${l}</span><b style="color:${wr}">${rt}</b></div></div>`;
  const hb = (t, bg) => `<div class="hb" style="background:${bg}"><span>${t}</span><i></i></div><div class="dn">(Angka dalam satuan rupiah)</div>`;

  return `<div class="db">
    <div class="top">
      <h1>KEUANGAN USAHA ELZAMORA</h1>
      <div class="fl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg>
        <label>Filter Periode Bulan<select id="bln"><option value="ytd">YTD</option>${BL.map((b, i) => `<option value="${i}" ${S.bln == i ? "selected" : ""}>${b}</option>`).join("")}</select></label>
        <label>Tahun<select id="thn">${th.map(y => `<option ${y == S.thn ? "selected" : ""}>${y}</option>`).join("")}</select></label>
      </div>
    </div>
    <div class="k4">
      ${kt("Total Revenue", "", nf(rev), "Pendapatan Month to Month", pf(mm), mm == null || mm >= 0 ? hij : mrh)}
      ${kt("Total Expenses", "", nf(exp), "Beban Usaha atas Pendapatan", pf(er), er == null || er < 80 ? hij : mrh)}
      ${kt("Laba Bersih Usaha", "", `<span style="color:${laba < 0 ? mrh : "inherit"}">${laba < 0 ? "-" : ""}${nf(Math.abs(laba))}</span>`, "Laba / Rugi Dihasilkan =", pf(lm), lm == null || lm >= 0 ? hij : mrh)}
      <div class="dc">
        <div class="dh"><span>Cashflow (in IDR)</span><i></i></div>
        <div class="cf"><span>Debet</span><b>${nf(c.m)}</b><span>Kredit</span><b>${nf(c.k)}</b><span>Balance</span><b>${c.m - c.k < 0 ? "-" : ""}${nf(Math.abs(c.m - c.k))}</b></div>
        <div class="df"><span>Dana Shopee belum cair</span><b>${nf(PS().L.reduce((x, y) => x + y.net - y.bayar, 0))}</b></div>
      </div>
    </div>
    <div class="gr">
      <div class="dc">${hb("Total Penjualan Usaha Per Bulan", mrh)}<div class="scroll">${cBarLine(pd, hp)}</div></div>
      <div class="dc">${hb("Sales Per Platform " + (S.bln == "ytd" ? "YTD" : BL[+S.bln]), mrh)}<div style="text-align:center">${cDonut(pl, tp)}</div><div class="lg">${pl.map((p, i) => `<span><i style="background:${WP[i]}"></i>${esc(p[0])}</span>`).join("")}</div></div>
      <div class="dc">${hb("Potongan Penjualan All Platform Per Bulan", "#0a3260")}<div class="scroll">${cLines(vo, ad)}</div></div>
      <div class="dc">${hb("Beban Usaha " + (S.bln == "ytd" ? "YTD" : BL[+S.bln]), "#0a3260")}<div class="bu"><div>${cPie(hpp, beb)}</div><div><div class="dn" style="text-align:left">Nominal</div><b class="dv2">${nf(exp)}</b><div class="lg2"><i style="background:#12ab92"></i>HPP<b style="color:#12ab92">${nf(hpp)}</b></div><div class="lg2"><i style="background:#f26b3a"></i>Beban<b style="color:#f26b3a">${nf(beb)}</b></div></div></div></div>
    </div>
  </div>`;
}

function lap() {
  const L = [["lr", "Laba Rugi"], ["nr", "Neraca"], ["cf", "Arus Kas"], ["gl", "Buku Besar"], ["cek", "Cek Data"]];
  return `<div class="bar no-print">` + L.map(x => `<button class="btn${S.lap == x[0] ? "" : " alt"}" data-l="${x[0]}">${x[1]}</button>`).join("") + `<button class="btn alt" id="btn-print" style="margin-left:auto">🖨️ Cetak / PDF</button></div>` + (S.lap == "nr" ? nr() : S.lap == "cf" ? arusKas() : S.lap == "gl" ? bukuBesar() : S.lap == "cek" ? cek() : lr());
}

function lr() {
  const r = hitung();
  const ms = S.bln == "ytd" ? [...Array(12).keys()] : [+S.bln];
  const v = k => (r[k] ? ms.reduce((s, m) => s + r[k][m], 0) : 0);
  const f = x => (x < 0 ? "(" + Math.abs(Math.round(x)).toLocaleString("id-ID") + ")" : x ? Math.round(x).toLocaleString("id-ID") : "–");
  const tot = g => jumlah(r, g, ms);
  const sek = g => `<tr class="sh"><td colspan="3">${AK[g].n}</td></tr>` + [...AK[g].a].sort((a, b) => a[0].localeCompare(b[0])).map(a => `<tr><td class="kd">${a[0].replace("-", "–")}</td><td>${esc(a[1])}</td><td class="nm">${f(v(a[0]))}</td></tr>`).join("") + `<tr class="tt"><td colspan="2">Total dari ${AK[g].n}</td><td class="nm">${f(tot(g))}</td></tr>`;
  const kot = tot("P") - tot("H"), lab = kot - tot("B");
  const per = S.bln == "ytd" ? "Januari – Desember " + S.thn : BL[+S.bln] + " " + S.thn;

    `<div class="panel rl scroll"><h2>LAPORAN LABA RUGI</h2><div class="per">KEUANGAN USAHA ELZAMORA · Periode ${per}</div><table id="tbl-lr">${sek("P")}${sek("H")}<tr class="big"><td colspan="2">LABA KOTOR</td><td class="nm ${kot < 0 ? "neg" : ""}">${f(kot)}</td></tr>${sek("B")}<tr class="big"><td colspan="2">LABA RUGI BERSIH</td><td class="nm ${lab < 0 ? "neg" : ""}">${f(lab)}</td></tr></table></div>`;
}

function nr() {
  const M = S.bln == "ytd" ? 11 : +S.bln;
  const m = {};
  semua().forEach(j => {
    const d = dt(j.tgl), y = d.getFullYear();
    if (y > S.thn || (y == S.thn && d.getMonth() > M)) return;
    (j.lines || []).forEach(l => { m[l.akun] = (m[l.akun] || 0) + (l.d || 0) - (l.k || 0); });
  });
  let labaLalu = 0;
  semua().forEach(j => { if (dt(j.tgl).getFullYear() < S.thn) (j.lines || []).forEach(l => { if (l.akun[0] >= "4") labaLalu -= (l.d || 0) - (l.k || 0); }); });
  const laba = -Object.keys(m).filter(k => k[0] >= "4").reduce((s, k) => s + m[k], 0) - labaLalu;
  const adaLT = AK.M.a.some(a => a[0] == "3-30100");
  const f = x => (x < 0 ? "(" + Math.abs(Math.round(x)).toLocaleString("id-ID") + ")" : x ? Math.round(x).toLocaleString("id-ID") : "–");
  const val = (k, sg) => sg * (m[k] || 0) + (k == "3-30201" ? laba + (adaLT ? 0 : labaLalu) : 0) + (k == "3-30100" && adaLT ? labaLalu : 0);
  const bar = (g, fl, sg) => AK[g].a.filter(a => fl(a[0])).map(a => `<tr><td class="kd">${a[0].replace("-", "–")}</td><td>${esc(a[1])}</td><td class="nm">${f(val(a[0], sg))}</td></tr>`).join("");
  const sum = (g, fl, sg) => AK[g].a.filter(a => fl(a[0])).reduce((s, a) => s + val(a[0], sg), 0);
  const blok = (jd, g, fl, sg, tj, c) => `<tr class="${c || "sh"}"><td colspan="3">${jd}</td></tr>` + bar(g, fl, sg) + `<tr class="tt"><td colspan="2">${tj}</td><td class="nm">${f(sum(g, fl, sg))}</td></tr>`;

  const lan = k => ["Kas & Bank", "Akun Piutang", "Persediaan", "Aktiva Lancar Lainnya"].includes(KAT[k]);
  const tet = k => KAT[k] == "Aktiva Tetap";
  const dep = k => KAT[k] == "Depresiasi & Amortisasi";
  const lai = k => KAT[k] == "Aktiva Lainnya";
  const pen = k => ["Akun Hutang", "Kewajiban Lancar Lainnya"].includes(KAT[k]);
  const pan = k => KAT[k] == "Kewajiban Jangka Panjang";
  const all = () => true;

  const tA = sum("A", all, 1), tL = sum("L", all, -1), tM = sum("M", all, -1);
  const sel = Math.round(tA - tL - tM);
  const tg = new Date(S.thn, M + 1, 0).getDate() + " " + BL[M] + " " + S.thn;

  return periode().replace("Satu tahun penuh (YTD)", "Akhir tahun (Desember)").replace("<label>Periode", "<label>Posisi per akhir") +
    `<div class="panel rl scroll"><h2>LAPORAN NERACA</h2><div class="per">Posisi per ${tg}</div><table><tr class="sh"><td colspan="3">ASET</td></tr>${blok("ASET LANCAR", "A", lan, 1, "Total Aset Lancar", "sb")}${blok("ASET TETAP", "A", tet, 1, "Total Aset Tetap", "sb")}${blok("DEPRESIASI & AMORTISASI", "A", dep, 1, "Total Depresiasi", "sb")}${blok("LAIN-LAIN", "A", lai, 1, "Total Lain-lain", "sb")}<tr class="big"><td colspan="2">TOTAL ASET</td><td class="nm">${f(tA)}</td></tr><tr class="sh"><td colspan="3">LIABILITAS DAN MODAL</td></tr>${blok("Liabilitas Jangka Pendek", "L", pen, -1, "Total Liabilitas Pendek", "sb")}${blok("Liabilitas Jangka Panjang", "L", pan, -1, "Total Liabilitas Panjang", "sb")}${blok("MODAL PEMILIK", "M", all, -1, "Total Modal Pemilik", "sb")}<tr class="big"><td colspan="2">TOTAL LIABILITAS DAN MODAL</td><td class="nm">${f(tL + tM)}</td></tr></table><p class="per"><span class="badge ${sel ? "no" : "ok"}">${sel ? "Belum seimbang · Selisih " + rp(sel) : "✓ Neraca Seimbang"}</span></p></div>`;
}

function arusKas() {
  const ms = S.bln == "ytd" ? [...Array(12).keys()] : [+S.bln];
  const per = S.bln == "ytd" ? "Januari – Desember " + S.thn : BL[+S.bln] + " " + S.thn;
  const kasSet = new Set(KAS.map(a => a[0]));
  let masukOp = 0, keluarHpp = 0, keluarBeb = 0, masukInv = 0, keluarInv = 0, masukFin = 0, keluarFin = 0;
  semua().forEach(j => {
    const d = dt(j.tgl);
    if (d.getFullYear() != S.thn || !ms.includes(d.getMonth())) return;
    const lines = j.lines || [];
    const kasDelta = lines.filter(l => kasSet.has(l.akun)).reduce((s, l) => s + (l.d || 0) - (l.k || 0), 0);
    if (!kasDelta) return;
    lines.filter(l => !kasSet.has(l.akun)).forEach(l => {
      const k0 = l.akun[0], amt = (l.k || 0) - (l.d || 0);
      if (k0 == "1" && KAT[l.akun] == "Aktiva Tetap") { if (amt >= 0) masukInv += amt; else keluarInv += -amt; }
      else if (k0 == "3" || KAT[l.akun] == "Kewajiban Jangka Panjang" || ["2-20202","2-20204","2-20205"].includes(l.akun)) { if (amt >= 0) masukFin += amt; else keluarFin += -amt; }
      else { if (amt >= 0) masukOp += amt; else keluarBeb += -amt; }
    });
  });
  const netOp = masukOp - keluarHpp - keluarBeb, netInv = masukInv - keluarInv, netFin = masukFin - keluarFin, kenaikan = netOp + netInv + netFin;
  const tAwal = S.thn + "-" + String((S.bln == "ytd" ? 0 : +S.bln) + 1).padStart(2, "0") + "-01";
  const tAkhir = S.thn + "-" + String((S.bln == "ytd" ? 11 : +S.bln) + 1).padStart(2, "0") + "-31";
  let sAwal = 0, sAkhir = 0;
  semua().forEach(j => {
    const t = String(j.tgl).slice(0, 10);
    (j.lines || []).forEach(l => {
      if (!kasSet.has(l.akun)) return;
      const v = (l.d || 0) - (l.k || 0);
      if (t < tAwal) sAwal += v;
      if (t <= tAkhir) sAkhir += v;
    });
  });
  const selKas = Math.round(sAwal + kenaikan - sAkhir);
  const f = x => (x < 0 ? "(" + Math.abs(Math.round(x)).toLocaleString("id-ID") + ")" : x ? Math.round(x).toLocaleString("id-ID") : "–");

  return periode() + `<div class="panel rl scroll"><h2>LAPORAN ARUS KAS</h2><div class="per">Periode ${per}</div><table><tr class="sh"><td colspan="2">OPERASIONAL</td></tr><tr><td>Penerimaan Kas &amp; Platform</td><td class="nm">${f(masukOp)}</td></tr><tr><td>Pembayaran Beban &amp; Supplier</td><td class="nm">${f(-keluarBeb)}</td></tr><tr class="tt"><td>Arus Kas Operasional</td><td class="nm">${f(netOp)}</td></tr><tr class="sh"><td colspan="2">INVESTASI &amp; PENDANAAN</td></tr><tr><td>Arus Kas Investasi</td><td class="nm">${f(netInv)}</td></tr><tr><td>Arus Kas Pendanaan</td><td class="nm">${f(netFin)}</td></tr><tr class="big"><td>KENAIKAN KAS</td><td class="nm">${f(kenaikan)}</td></tr><tr><td>Saldo Awal</td><td class="nm">${f(sAwal)}</td></tr><tr class="big"><td>SALDO AKHIR</td><td class="nm">${f(sAwal + kenaikan)}</td></tr></table></div>`;
}

function bukuBesar() {
  const ak = S.glAkun || "1-10100";
  const normalKredit = ["2", "3", "4"].includes(ak[0]);
  let saldo = 0;
  const rows = [];
  semua().sort((a, b) => a.tgl.localeCompare(b.tgl)).forEach(j => {
    (j.lines || []).forEach(l => {
      if (l.akun == ak) {
        const d = l.d || 0, k = l.k || 0;
        saldo += normalKredit ? k - d : d - k;
        rows.push({ tgl: j.tgl, ket: j.ket, d, k, saldo, auto: j.auto });
      }
    });
  });
  return `<div class="bar"><label>Pilih Akun Buku Besar<select id="gl-akun">${opsi().replace(`value="${ak}"`, `value="${ak}" selected`)}</select></label></div><div class="panel scroll"><h2>Buku Besar: ${esc(ak)} — ${esc(nama(ak))} <span class="badge ok">Saldo: ${rp(saldo)}</span></h2>${rows.length ? `<table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Sumber</th><th>Debet</th><th>Kredit</th><th>Saldo</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.tgl}</td><td style="text-align:left">${esc(r.ket)}</td><td>${r.auto ? "Otomatis" : "Manual"}</td><td>${r.d ? rp(r.d) : "–"}</td><td>${r.k ? rp(r.k) : "–"}</td><td><b>${rp(r.saldo)}</b></td></tr>`).join("")}</tbody></table>` : `<div class="empty">Belum ada mutasi.</div>`}</div>`;
}

function cek() {
  const gl = k => semua().reduce((s, j) => s + (j.lines || []).filter(l => l.akun == k).reduce((a, l) => a + (l.d || 0) - (l.k || 0), 0), 0);
  const sisa = (t, ak) => HP.filter(h => h.tipe == t && (h.akun || (t == "hutang" ? "2-20100" : "1-10100")) == ak).reduce((s, h) => s + h.nom - (h.bayar || 0), 0);
  const H = HPPM(), C = [];
  const ok = x => Math.round(x) == 0;
  C.push(["Jurnal Seimbang", !JR.some(j => !ok((j.lines || []).reduce((a, l) => a + (l.d || 0) - (l.k || 0), 0))), "Sesuai"]);
  C.push(["Piutang Usaha", ok(gl("1-10100") - (PS().L.reduce((s, x) => s + x.net - x.bayar, 0) + sisa("piutang", "1-10100"))), "Sesuai"]);
  C.push(["Hutang Usaha", ok(-gl("2-20100") - sisa("hutang", "2-20100")), "Sesuai"]);
  C.push(["Persediaan", ok(gl("1-10200") - Object.values(H.st).reduce((s, x) => s + x.v, 0)), "Sesuai"]);
  return `<div class="panel scroll"><h2>Audit Akuntansi</h2><table><thead><tr><th>Pemeriksaan</th><th>Hasil</th><th>Rincian</th></tr></thead><tbody>${C.map(c => `<tr><td style="text-align:left">${c[0]}</td><td><span class="badge ${c[1] ? "ok" : "no"}">${c[1] ? "Sesuai" : "Cek"}</span></td><td style="text-align:left">${c[2]}</td></tr>`).join("")}</tbody></table></div>`;
}

function opsi() {
  return ["A", "L", "M", "P", "H", "B"].map(g => `<optgroup label="${AK[g].n}">${AK[g].a.map(a => `<option value="${a[0]}">${a[0]} — ${esc(a[1])}</option>`).join("")}</optgroup>`).join("");
}

function barisJ() {
  const listId = "list_akun_" + Math.random().toString(36).slice(2, 6);
  const optList = ["A", "L", "M", "P", "H", "B"].flatMap(g => AK[g].a.map(a => `<option value="${a[0]} — ${esc(a[1])}">`)).join("");
  return `<div class="jl"><div style="position:relative"><input class="ja" list="${listId}" placeholder="Ketik kode atau nama akun..." style="width:100%"><datalist id="${listId}">${optList}</datalist></div><input class="jd" type="number" min="0" step="1" placeholder="Debet"><input class="jk" type="number" min="0" step="1" placeholder="Kredit"><button class="x jx" type="button">Hapus</button></div>`;
}

function jr() {
  const hari = hariIni();
  const KT = { 1: "Aset", 2: "Liabilitas", 3: "Modal", 4: "Pendapatan", 5: "HPP", 6: "Beban" };
  const q = (S.jrQ || "").toLowerCase();
  const E = semua().filter(j => !q || (j.ket || "").toLowerCase().includes(q)).sort((a, b) => b.tgl.localeCompare(a.tgl));
  let no = 0;
  const rows = E.map(j => {
    let bal = 0;
    return (j.lines || []).map((l, i) => {
      bal += (l.d || 0) - (l.k || 0);
      const rf = i ? null : j.ref;
      return `<tr><td>${++no}</td><td>${j.tgl}</td><td>${KT[l.akun[0]] || ""}</td><td>${esc(nama(l.akun))}</td><td><code>${esc(l.akun)}</code></td><td style="text-align:left">${esc(j.ket || "")}</td><td>${l.d ? rp(l.d) : ""}</td><td>${l.k ? rp(l.k) : ""}</td><td>${rp(bal)}</td><td>${i ? "" : j.auto ? '<span class="badge ok">Otomatis</span>' : `<button class="x" data-id="${esc(j.id)}">Hapus</button>`}</td></tr>`;
    }).join("");
  }).join("");

  return `<div class="panel"><h2>Catat Jurnal Umum Manual</h2><div class="form"><label>Tanggal<input type="date" id="j-tgl" value="${hari}"></label><label style="grid-column:span 2">Deskripsi<input id="j-ket" placeholder="Keterangan transaksi"></label></div><div id="j-baris">${barisJ()}${barisJ()}</div><div class="bar" style="margin:8px 0 12px"><button class="btn alt" type="button" id="j-tb">+ Tambah baris</button><span id="j-tot" style="font-weight:700"></span></div><button class="btn" id="j-simpan">Simpan Jurnal</button><div id="j-err" class="neg"></div></div><div class="panel scroll"><h2>Jurnal Umum</h2>${rows ? `<table><thead><tr><th>No</th><th>Tanggal</th><th>Kategori</th><th>Nama Akun</th><th>Kode</th><th>Deskripsi</th><th>Debet</th><th>Kredit</th><th>Balance</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">Belum ada jurnal.</div>'}</div>`;
}

function hitJ() {
  let d = 0, k = 0;
  document.querySelectorAll("#j-baris .jl").forEach(r => { d += +r.querySelector(".jd").value || 0; k += +r.querySelector(".jk").value || 0; });
  const t = document.getElementById("j-tot");
  if (t) { t.textContent = "Debet " + rp(d) + " · Kredit " + rp(k) + (d == k && d > 0 ? " · ✓ Seimbang" : " · Selisih " + rp(Math.abs(d - k))); t.className = d == k && d > 0 ? "pos" : "neg"; }
  return [d, k];
}

function bindJ() {
  const b = document.getElementById("j-baris");
  const pasang = () => b.querySelectorAll(".jl").forEach(r => { r.oninput = hitJ; r.querySelector(".jx").onclick = () => { if (b.children.length > 2) { r.remove(); hitJ(); } }; });
  pasang(); hitJ();
  document.getElementById("j-tb").onclick = () => { b.insertAdjacentHTML("beforeend", barisJ()); pasang(); hitJ(); };
  document.getElementById("j-simpan").onclick = () => {
    const e = document.getElementById("j-err"), t = document.getElementById("j-tgl").value, lines = [];
    let salah = "";
    b.querySelectorAll(".jl").forEach(r => {
      const aMatch = r.querySelector(".ja").value.split("—")[0].trim();
      const d = +r.querySelector(".jd").value || 0, k = +r.querySelector(".jk").value || 0;
      if (!aMatch && !d && !k) return;
      if (!AKUN.some(x => x.kode == aMatch)) salah = "Akun tidak valid.";
      else if (d && k) salah = "Satu baris hanya boleh debet atau kredit.";
      else lines.push(d ? { akun: aMatch, d, k: 0 } : { akun: aMatch, d: 0, k });
    });
    const [d, k] = hitJ();
    if (!salah && d != k) salah = "Debet dan kredit belum seimbang.";
    if (salah) { e.textContent = salah; return; }
    JR.push({ id: uid(), tgl: t, ket: document.getElementById("j-ket").value.trim() || "Jurnal Umum", lines });
    simpanLokal(); info = "Jurnal disimpan."; draw();
  };
  document.querySelectorAll("[data-id]").forEach(x => (x.onclick = () => { JR = JR.filter(j => j.id != x.dataset.id); simpanLokal(); draw(); }));
}

function jual() {
  const T = S.toko;
  const L = P.filter(p => dt(p.tgl).getFullYear() == S.thn && (T == "all" || (p.toko || "java") == T)).sort((a, b) => b.tgl.localeCompare(a.tgl));
  const s = f => L.reduce((x, p) => x + f(p), 0);
  const HC = HPPM().c;
  const totHpp = s(p => HC[(p.toko || "java") + "|" + p.tgl + "|" + p.no + "|" + p.sku] || 0);
  const TK = { java: "Java Collection", kong: "Kong Fat Official", lazada: "Lazada", tiktok: "TikTok Shop" };
  const op = Object.keys(TK).map(k => `<option value="${k}" ${T == k ? "selected" : ""}>${TK[k]}</option>`).join("");

  return `<div class="bar"><label>Filter Toko<select id="tk"><option value="all">Semua Toko</option>${op}</select></label><label>Tahun<select id="thn">${daftarTahun().map(y => `<option ${y == S.thn ? "selected" : ""}>${y}</option>`).join("")}</select></label></div>
  <div class="kpis"><div class="kpi"><span>Pesanan</span><b>${new Set(L.map(p => p.no)).size}</b></div><div class="kpi"><span>Penjualan Kotor</span><b>${rp(s(p => p.hrg * p.jml))}</b></div><div class="kpi"><span>Voucher &amp; Admin</span><b>${rp(s(p => (p.vc || 0) + (p.adm || 0)))}</b></div><div class="kpi"><span>Total HPP</span><b>${rp(totHpp)}</b></div></div>
  <div class="panel scroll"><h2>Data Penjualan (${S.thn})</h2>${L.length ? `<table><thead><tr><th>Tanggal</th><th>Toko</th><th>No. Pesanan</th><th>SKU</th><th>Jumlah</th><th>Harga</th><th>HPP</th></tr></thead><tbody>${L.map(p => `<tr><td>${p.tgl}</td><td>${TK[p.toko || "java"]}</td><td><code>${p.no}</code></td><td><b>${p.sku}</b></td><td>${p.jml}</td><td>${rp(p.hrg)}</td><td>${rp(HC[(p.toko || "java") + "|" + p.tgl + "|" + p.no + "|" + p.sku] || 0)}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">Belum ada data penjualan.</div>'}</div>`;
}

function bindS() {
  const tkSelect = document.getElementById("tk"); if (tkSelect) tkSelect.onchange = e => { S.toko = e.target.value; draw(); };
  bindP();
}

function sp() {
  const { L } = PS();
  const totAll = L.reduce((s, x) => s + x.net - x.bayar, 0);
  return `<div class="kpis"><div class="kpi"><span>Total Piutang Shopee</span><b>${rp(totAll)}</b></div></div>`;
}

function hp() {
  const sisa = t => HP.filter(h => h.tipe == t).reduce((s, h) => s + h.nom - (h.bayar || 0), 0);
  return sp() + `<div class="kpis"><div class="kpi"><span>Sisa Piutang Lainnya</span><b>${rp(sisa("piutang"))}</b></div><div class="kpi"><span>Sisa Hutang</span><b>${rp(sisa("hutang"))}</b></div></div>`;
}

function bindH() {}

function inv() {
  const H = HPPM(), nilai = Object.values(H.st).reduce((s, x) => s + Math.max(0, x.v), 0);
  return `<div class="kpis"><div class="kpi"><span>Jumlah SKU</span><b>${INV.length}</b></div><div class="kpi"><span>Nilai Sisa Stok</span><b>${rp(nilai)}</b></div></div><div class="panel scroll"><h2>Persediaan Barang</h2><table><thead><tr><th>SKU</th><th>Nama Barang</th><th>Stok</th><th>HPP Rata-rata</th><th>Nilai Akhir</th></tr></thead><tbody>${INV.map(i => { const st = H.st[i.sku] || { q: i.stok, l: i.hrg, v: i.stok * i.hrg }; return `<tr><td><b>${esc(i.sku)}</b></td><td style="text-align:left">${esc(i.nama)}</td><td>${st.q}</td><td>${rp(st.l)}</td><td><b>${rp(Math.max(0, st.v))}</b></td></tr>`; }).join("")}</tbody></table></div>`;
}

function bindV() {}

function beli() {
  const tot = BE.reduce((s, b) => s + b.jml * b.hrg, 0);
  return `<div class="kpis"><div class="kpi"><span>Total Pembelian</span><b>${rp(tot)}</b></div></div><div class="panel scroll"><h2>Riwayat Pembelian</h2>${BE.length ? `<table><thead><tr><th>Tanggal</th><th>Supplier</th><th>SKU</th><th>Jumlah</th><th>Total</th></tr></thead><tbody>${BE.map(b => `<tr><td>${b.tgl}</td><td>${b.toko}</td><td><b>${b.sku}</b></td><td>${b.jml}</td><td>${rp(b.jml * b.hrg)}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">Belum ada pembelian.</div>'}</div>`;
}

function bindB() {}

async function simpanFile(nama, data) {
  try {
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if (!dl) { info = "Unduh file tidak tersedia."; draw(); return; }
    await dl.save({ filename: nama, data });
  } catch (e) {}
}
function simpanXlsx(wb, nama) { return simpanFile(nama, XLSX.write(wb, { bookType: "xlsx", type: "array" })); }
function unduhCadangan() { simpanFile("keuangan-elzamora-" + hariIni() + ".json", JSON.stringify({ JR, P, INV, BE, HP, CA, OP, AKUN, KATS, SKUS }, null, 2)); }

function dat() {
  return `<div class="grid2"><div class="panel"><h2>Cadangan &amp; Pemulihan</h2><div class="bar"><button class="btn" id="ex">⬇️ Unduh Cadangan (.json)</button></div></div></div>`;
}

function bindD() {
  document.getElementById("ex").onclick = unduhCadangan;
}

function st() {
  return `<div class="panel"><h2>Setup Akun &amp; SKU</h2><p>Master Akun dan SKU aktif.</p></div>`;
}

function bindT() {}

function draw() {
  nav();
  const a = document.getElementById("app");
  const T = { dash, lap, jurnal: jr, jual, hp, inv, beli, setup: st, data: dat };
  const B = { dash: bindP, lap: bindL, jurnal: bindJ, jual: bindS, hp: bindH, inv: bindV, beli: bindB, setup: bindT, data: bindD };
  a.innerHTML = banner() + (T[S.tab] || dash)() + (S.tab == "data" ? "" : '<p id="gd-wrap"><button class="x" id="gd" type="button" style="color:var(--ac)">⚙️ Cadangan &amp; Reset</button></p>');
  (B[S.tab] || bindP)();
  const g = document.getElementById("gd"); if (g) g.onclick = () => { S.tab = "data"; draw(); };
}

function mulai() {
  const savedTheme = localStorage.getItem("ktoko_theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

  document.getElementById("btn-theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("ktoko_theme", next);
  };
  document.getElementById("btn-demo").onclick = () => { muatDataDemo(false); };
  document.getElementById("btn-backup").onclick = () => { S.tab = "data"; draw(); };

  const ada = muatLokal();
  rebuildAK();
  setStatus("Menghubungkan ke Firebase Firestore…");
  draw();
  sambungOnline().then(ok => {
    if (!ok) {
      setStatus("Mode offline · data lokal", true);
      if (!ada || (P.length === 0 && JR.length === 0)) muatDataDemo(true);
    }
    draw();
  });
}

mulai();
</script>
</body>
</html>
