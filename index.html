<style>
:root {
  --bg: #f4f6f4;
  --sf: #ffffff;
  --sf2: #f9fbf9;
  --ink: #182625;
  --mut: #647573;
  --ln: #dce2de;
  --ac: #0f766e;
  --ac-hov: #0d635c;
  --neg: #c53030;
  --pos: #0f766e;
  --warn: #d97706;
  --shadow: 0 2px 6px rgba(24, 38, 37, 0.05), 0 1px 2px rgba(24, 38, 37, 0.04);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1716;
    --sf: #172322;
    --sf2: #1d2b2a;
    --ink: #e6efed;
    --mut: #94a6a3;
    --ln: #283836;
    --ac: #2dd4bf;
    --ac-hov: #14b8a6;
    --neg: #f87171;
    --pos: #34d399;
    --warn: #fbbf24;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1716;
  --sf: #172322;
  --sf2: #1d2b2a;
  --ink: #e6efed;
  --mut: #94a6a3;
  --ln: #283836;
  --ac: #2dd4bf;
  --ac-hov: #14b8a6;
  --neg: #f87171;
  --pos: #34d399;
  --warn: #fbbf24;
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.55 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  padding: 18px 20px 0;
  max-width: 1180px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-badge {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
  box-shadow: var(--shadow);
}
h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -.02em;
  font-weight: 800;
}
.sub-brand {
  font-size: 12px;
  color: var(--mut);
  font-weight: 500;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pill-btn {
  background: var(--sf);
  border: 1px solid var(--ln);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: 8px;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow);
  transition: all 0.15s ease;
}
.pill-btn:hover { border-color: var(--ac); color: var(--ac); }
.pill-btn.demo { background: rgba(15, 118, 110, 0.08); border-color: var(--ac); color: var(--ac); }

nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--ln);
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--mut);
  padding: 10px 14px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
nav button:hover { color: var(--ink); }
nav button[aria-selected=true] {
  color: var(--ac);
  border-color: var(--ac);
}
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
main {
  max-width: 1180px;
  margin: auto;
  padding: 18px 20px 40px;
}
.bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 16px;
}
label {
  font-size: 12.5px;
  color: var(--mut);
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-weight: 600;
}
input, select {
  font: inherit;
  padding: 8px 11px;
  border: 1px solid var(--ln);
  border-radius: 8px;
  background: var(--sf);
  color: var(--ink);
  min-width: 0;
  transition: border-color 0.15s;
}
input:focus, select:focus { border-color: var(--ac); }
.btn {
  background: var(--ac);
  color: #fff;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 9px 16px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity 0.15s, transform 0.1s;
}
:root[data-theme="dark"] .btn { color: #091312; }
.btn:hover { opacity: 0.92; }
.btn:active { transform: translateY(1px); }
.btn.alt {
  background: var(--sf);
  color: var(--ink);
  border: 1px solid var(--ln);
}
.btn.alt:hover { border-color: var(--ac); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.kpi {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--ac);
}
.kpi span { font-size: 12px; color: var(--mut); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.kpi b { display: block; font-size: 21px; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi small { color: var(--mut); font-size: 12px; display: block; margin-top: 2px; }

.panel {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
h2 {
  font-size: 15.5px;
  margin: 0 0 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.grid2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
}
.scroll { overflow-x: auto; }
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}
th, td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--ln);
  text-align: right;
  white-space: nowrap;
}
th {
  background: var(--sf2);
  color: var(--mut);
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
th:first-child, td:first-child { text-align: left; }
tbody tr:hover td { background: var(--sf2); }
tr.g td { font-weight: 700; background: var(--bg); }
tr.t td { font-weight: 700; border-top: 2px solid var(--ink); }
.neg { color: var(--neg); }
.pos { color: var(--pos); }
.warn { color: var(--warn); }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 700;
}
.badge.ok { background: rgba(15, 118, 110, 0.14); color: var(--pos); }
.badge.no { background: rgba(197, 48, 48, 0.14); color: var(--neg); }
.badge.wn { background: rgba(217, 119, 6, 0.15); color: var(--warn); }

.form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 12px;
  align-items: end;
}
.x {
  background: none;
  border: 0;
  color: var(--neg);
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
}
.x:hover { background: rgba(197, 48, 48, 0.1); }
.empty { color: var(--mut); padding: 18px 0; text-align: center; font-style: italic; }

/* Executive Dashboard Styles */
.db h1 {
  color: #d0021b;
  font-size: clamp(20px, 3.5vw, 30px);
  margin: 0;
  letter-spacing: .01em;
  font-weight: 800;
}
:root[data-theme="dark"] .db h1 { color: #ff5a6e; }
.db .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 14px;
  background: var(--sf);
  padding: 14px 18px;
  border-radius: 10px;
  border: 1px solid var(--ln);
  box-shadow: var(--shadow);
}
.db .fl {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid #f26b3a;
  border-radius: 8px;
  padding: 0 12px 0 0;
  background: var(--sf);
  overflow: hidden;
}
.db .fl > svg {
  background: #f26b3a;
  padding: 11px;
  box-sizing: content-box;
  flex-shrink: 0;
}
.db .fl label {
  flex-direction: row;
  align-items: center;
  gap: 6px;
  color: var(--ink);
  font-weight: 700;
  font-size: 13px;
}
.db .fl select {
  border: 0;
  font-weight: 800;
  padding: 7px 4px;
  background: transparent;
  cursor: pointer;
}
.db .dc {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  min-width: 0;
  padding-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.db .dh {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  border-bottom: 3px solid #d0021b;
  font-weight: 700;
  font-size: 15px;
}
.db .dh span { padding: 10px 14px; }
.db i.ob, .db .dh i, .db .hb i {
  width: 40px;
  background: #f26b3a;
  display: block;
  flex-shrink: 0;
}
.db .hb {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
}
.db .hb span { padding: 9px 14px; }
.db .dn {
  text-align: center;
  font-style: italic;
  font-size: 11.5px;
  color: var(--mut);
  padding: 6px 0 2px;
}
.db .dv {
  text-align: center;
  font-size: clamp(23px, 2.8vw, 33px);
  font-weight: 800;
  padding: 8px 10px;
  font-variant-numeric: tabular-nums;
}
.db .df {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 14px 2px;
  font-style: italic;
  font-size: 12.5px;
  font-weight: 600;
  margin-top: auto;
}
.db .df b {
  border: 1px dashed var(--mut);
  padding: 3px 10px;
  border-radius: 5px;
  font-style: normal;
  min-width: 68px;
  text-align: center;
}
.db .k4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.db .cf {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 12px;
  padding: 10px 14px;
  font-weight: 700;
  font-size: 13.5px;
}
.db .cf b {
  text-align: right;
  font-size: 15.5px;
  font-variant-numeric: tabular-nums;
}
.db .gr {
  display: grid;
  grid-template-columns: minmax(0, 1.9fr) minmax(0, 1.1fr);
  gap: 14px;
}
@media(max-width: 840px) {
  .db .gr { grid-template-columns: minmax(0, 1fr); }
}
.db .lg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  justify-content: center;
  font-size: 12px;
  padding: 4px 10px;
}
.db .lg i {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin-right: 5px;
}
.db .bu {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: center;
  justify-content: center;
  padding: 10px 14px;
}
.db .dv2 { display: block; font-size: 22px; margin: 2px 0 10px; font-weight: 800; }
.db .lg2 { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.db .lg2 i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; }
.db .lg2 b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.db svg text { font-size: 10px; }

/* Financial Reports (Laba Rugi, Neraca, Arus Kas) */
.rl { max-width: 820px; margin: 0 auto 16px; }
.rl h2 { text-align: center; font-size: 18px; margin: 0; justify-content: center; }
.rl .per { text-align: center; color: var(--mut); font-size: 13px; margin-bottom: 14px; }
.rl td { text-align: left; border: 0; padding: 5px 8px; }
.rl .nm { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rl .kd { width: 90px; color: var(--mut); font-family: ui-monospace, monospace; font-size: 12.5px; }
.rl .sh td { font-weight: 800; padding-top: 18px; text-transform: uppercase; color: var(--ac); letter-spacing: 0.03em; }
.rl .tt td { font-weight: 700; border-top: 1.5px solid var(--ink); padding-top: 7px; }
.rl .big td { font-weight: 800; background: var(--sf2); padding: 10px 8px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); font-size: 14.5px; }
.rl .sb td { font-weight: 700; padding-top: 14px; }
.rl .sb .nm { font-weight: 600; }

.jl {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}
@media(max-width: 560px) {
  .jl { grid-template-columns: 1fr 1fr; }
  .jl .ja { grid-column: 1 / -1; }
}
svg text { fill: var(--mut); font-size: 11px; }

.toast-banner {
  background: var(--sf);
  border-left: 4px solid var(--ac);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
  font-size: 13.5px;
}

@media print {
  header, .bar, .no-print, #gd-wrap { display: none !important; }
  body { background: #fff; color: #000; }
  main { max-width: 100%; padding: 0; }
  .panel { border: 0; box-shadow: none; padding: 0; }
}
tbody tr:hover td { background: color-mix(in srgb, var(--ac) 6%, transparent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { header nav, .no-print { display: none !important; } }
</style>
</head>

function syncOnline() {
  clearTimeout(tmrSync);
  if (!window.dbFirestore) return;
  setStatus("Menyimpan ke online…");
  tmrSync = setTimeout(async () => {
    try {
      const o = DOCS();
      for (const path in o) {
        const j = JSON.stringify(o[path]);
        if (SYNC[path] === j) continue;
        const parts = path.split("/");
        const docRef = window.firebaseDoc(window.firebaseCollection(window.dbFirestore, parts[0]), parts[1]);
        await window.firebaseSetDoc(docRef, o[path]);
        SYNC[path] = j;
      }
      setStatus("Tersambung · data tersimpan online (" + new Date().toLocaleTimeString("id-ID") + ")");
    } catch (e) {
      setStatus("Gagal menyimpan online: " + (e.message || e.code || e) + ". Data tetap aman di browser ini.", true);
    }
  }, 700);
}
function terapkanDoc(path, d) {
  const j = JSON.stringify(d);
  if (SYNC[path] === j) return false;
  SYNC[path] = j;
  const a = path.split("/");
  if (a[0] == "penjualan") { MP[a[1]] = d.d || []; P = Object.keys(MP).sort().reduce((r, k) => r.concat(MP[k]), []); }
  else if (a[1] == "jr") JR = d.d || [];
  else if (a[1] == "inv") INV = d.d || [];
  else if (a[1] == "be") BE = d.d || [];
  else if (a[1] == "hp") HP = d.d || [];
  else if (a[1] == "ca") CA = d.d || [];
  else if (a[1] == "op") OP = d.d || [];
  else if (a[1] == "setup") { if (d.akun && d.akun.length) AKUN = d.akun; if (d.kats && d.kats.length) KATS = d.kats; if (d.skus && d.skus.length) SKUS = d.skus; }
  return true;
}

function HPPM() {
  const ev = [], c = {}, opVal = {}, st = {};
  INV.forEach(i => {
    st[i.sku] = { q: i.stok, v: i.stok * i.hrg, l: i.hrg };
  });
  BE.forEach(b => ev.push({ t: 0, tgl: b.tgl, sku: b.sku, q: b.jml, v: b.jml * b.hrg }));
  P.forEach(p =>
    ev.push({
      t: 1,
      tgl: p.tgl,
      sku: p.sku,
      q: p.jml,
      k: (p.toko || "java") + "|" + p.tgl + "|" + p.no + "|" + p.sku
    })
  );
  OP.forEach(o =>
    ev.push({
      t: 2,
      tgl: o.tgl,
      sku: o.sku,
      diff: o.diff,
      id: o.id
    })
  );
  ev.sort((a, b) => a.tgl.localeCompare(b.tgl) || a.t - b.t).forEach(e => {
    const x = st[e.sku];
    if (!x) return;
    if (e.t == 0) {
      x.q += e.q;
      x.v += e.v;
      x.l = x.q > 0 ? x.v / x.q : x.l;
    } else if (e.t == 1) {
      const av = x.q > 0 ? x.v / x.q : x.l;
      const k = e.q * av;
      c[e.k] = k;
      x.q -= e.q;
      x.v -= k;
      if (x.q > 0) x.l = x.v / x.q;
    } else if (e.t == 2) {
      const av = x.q > 0 ? x.v / x.q : x.l;
      const dv = e.diff * av;
      opVal[e.id] = dv;
      x.q += e.diff;
      x.v += dv;
      if (x.q > 0) x.l = x.v / x.q;
    }
  });
  return { c, opVal, st };
}

                { akun: x.akun, d: 0, k: x.nom }
              ]
            : [
                { akun: x.akun, d: x.nom, k: 0 },

  );

  HP.forEach(h => {

        ket: "Pencatatan " + (h.tipe == "hutang" ? "hutang " : "piutang ") + h.no + " " + h.pihak + " (otomatis)",

              { akun: "5-50204", d: absVal, k: 0 },
              { akun: "1-10200", d: 0, k: absVal }

  return E;
}

function hitungAlokasiCair() {
  const M = {};
  P.forEach(p => {
    const tk = p.toko || "java";
    const kd = kodePiutangToko(tk, p.tgl);
    const x = (M[kd] = M[kd] || { kode: kd, toko: tk, bln: p.tgl.slice(0, 7), net: 0, bayar: 0 });
    x.net += p.hrg * p.jml - (p.vc || 0) - (p.adm || 0);
  });
  const list = Object.values(M).sort((a, b) => a.bln.localeCompare(b.bln) || a.kode.localeCompare(b.kode));
  const refMap = {};
  [...CA]
    .sort((a, b) => a.tgl.localeCompare(b.tgl))
    .forEach(c => {
      const tk = c.toko || (c.kode && c.kode.includes("-KONG-") ? "kong" : "java");
      if (c.kode && M[c.kode]) {
        refMap[c.id] = c.kode;
        M[c.kode].bayar += c.nom;
      } else {
        const kandidat = list.find(x => x.toko == tk && x.net - x.bayar > 0) || list.find(x => x.toko == tk);
        if (kandidat) {
          refMap[c.id] = kandidat.kode;
          kandidat.bayar += c.nom;
        } else {
          refMap[c.id] = kodePiutangToko(tk, c.tgl);
        }
      }
    });
  return refMap;
}

function PS() {
  const M = {};
  JA()
    .filter(e => e.net != null)
    .sort((a, b) => a.tgl.localeCompare(b.tgl) || a.ref.no.localeCompare(b.ref.no))
    .forEach(e => {
      const tk = e.toko || (e.ref.no.includes("-KONG-") ? "kong" : "java");
      const x = (M[e.ref.no] = M[e.ref.no] || {
        kode: e.ref.no,
        toko: tk,
        bln: e.tgl.slice(0, 7),
        net: 0,
        bayar: 0
      });
      x.net += e.net;
    });

  const L = Object.values(M).sort((a, b) => a.bln.localeCompare(b.bln) || a.kode.localeCompare(b.kode));
  let lebih = 0;
  const lebihToko = { java: 0, kong: 0 };
  const sisaCairToko = {};
  [...CA]
    .sort((a, b) => a.tgl.localeCompare(b.tgl))
    .forEach(c => {
      const tk = c.toko || (c.kode && c.kode.includes("-KONG-") ? "kong" : "java");
      if (c.kode && M[c.kode]) {
        const x = M[c.kode];
        const ruang = Math.max(0, x.net - x.bayar);
        const pakai = Math.min(ruang, c.nom);
        x.bayar += pakai;
        const sisa = c.nom - pakai;
        if (sisa > 0) sisaCairToko[tk] = (sisaCairToko[tk] || 0) + sisa;
      } else {
        sisaCairToko[tk] = (sisaCairToko[tk] || 0) + c.nom;
      }
    });

  Object.keys(sisaCairToko).forEach(tk => {
    let t = sisaCairToko[tk] || 0;
    L.filter(x => x.toko == tk).forEach(x => {
      const ruang = Math.max(0, x.net - x.bayar);
      const u = Math.min(t, ruang);
      x.bayar += u;
      t -= u;
    });
    if (t > 0) {
      lebih += t;
      lebihToko[tk] = (lebihToko[tk] || 0) + t;
    }
  });

  return { L, lebih, lebihToko };
}

function kas(ms) {
  let m = 0, k = 0;
  semua().forEach(j => {
    const d = dt(j.tgl);
    if (d.getFullYear() != S.thn || !ms.includes(d.getMonth())) return;
    (j.lines || []).forEach(l => {
      if (KAS.some(a => a[0] == l.akun)) {
        m += l.d || 0;
        k += l.k || 0;
      }
    });
  });
  return { m, k };
}

function hitung() {
  const r = {};
  const a = (k, m, v) => {
    if (v) (r[k] = r[k] || Array(12).fill(0))[m] += v;
  };
  for (const j of semua()) {
    const d = dt(j.tgl);
    if (d.getFullYear() != S.thn) continue;
    const m = d.getMonth();
    (j.lines || []).forEach(l => {
      const g = grup(l.akun);
      if (g == "P") a(l.akun, m, (l.k || 0) - (l.d || 0));
      else if (g == "H" || g == "B") a(l.akun, m, (l.d || 0) - (l.k || 0));
    });
  }
  return r;
}

function jumlah(r, g, ms) {
  let s = 0;
  for (const k in r) if (grup(k) == g) ms.forEach(m => (s += r[k][m]));
  return s;
}

function cBarLine(a, b) {
  const W = 760, x0 = 32, pw = (W - 2 * x0) / 12, B = 190;
  const mx = Math.max(1, ...a, ...b);
  const y = v => B - (v / mx) * (B - 34);
  const X = i => x0 + pw * i + pw / 2;
  let s = `<svg viewBox="0 0 ${W} 250" width="100%" style="min-width:540px" role="img" aria-label="Pendapatan dan HPP per bulan">
    <line x1="${x0}" x2="${W - x0}" y1="${B}" y2="${B}" stroke="var(--ln)"/>`;
  a.forEach((v, i) => {
    if (v > 0) {
      const h = Math.max(2, B - y(v));
      s += `<rect x="${X(i) - 16}" y="${y(v)}" width="32" height="${h}" rx="3" fill="#12ab92"/>
            <text x="${X(i)}" y="${y(v) - 6}" text-anchor="middle">${nf(v)}</text>`;
    }
    s += `<text x="${X(i)}" y="${B + 20}" text-anchor="middle">${BL[i].slice(0, 3).toLowerCase()}</text>`;
  });
  return (
    s +
    `<polyline fill="none" stroke="#f26b3a" stroke-width="2.5" points="${b.map((v, i) => X(i) + "," + y(v)).join(" ")}"/>` +
    b.map((v, i) => `<circle cx="${X(i)}" cy="${y(v)}" r="4.5" fill="var(--sf)" stroke="#f26b3a" stroke-width="2.5"/>`).join("") +

     <circle cx="410" cy="236" r="5" fill="none" stroke="#f26b3a" stroke-width="2.5"/><text x="420" y="240">HPP</text></svg>`
  );

function cLines(a, b) {

  const y = v => B - (v / mx) * (B - 34);

     <circle cx="390" cy="236" r="5" fill="none" stroke="#f26b3a" stroke-width="2.5"/><text x="400" y="240">ADMIN FEE</text></svg>`
  );
}

function cDonut(pl, tp) {
  const C = 2 * Math.PI * 70;
  const top = pl.reduce((x, y) => (y[1] > x[1] ? y : x), pl[0]);
  let off = 0, g = "", lb = "";
  pl.forEach((p, i) => {
    const l = tp ? (p[1] / tp) * C : 0;
    if (l > 0) {
      g += `<circle r="70" fill="none" stroke="${WP[i]}" stroke-width="38" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}"/>`;
      const an = ((off + l / 2) / C) * 2 * Math.PI - Math.PI / 2;
      const pct = Math.round((p[1] / tp) * 100);
      if (pct >= 5) {
        lb += `<text x="${150 + 70 * Math.cos(an)}" y="${115 + 70 * Math.sin(an) + 4}" text-anchor="middle" style="fill:#fff;font-weight:700">${pct}%</text>`;
      }
      off += l;
    }
  });
  if (!tp) {
    g = `<circle r="70" fill="none" stroke="var(--ln)" stroke-width="38"/>`;
  }
  return `<svg viewBox="0 0 300 230" width="100%" style="max-width:340px" role="img" aria-label="Penjualan per platform">
    <g transform="translate(150,115) rotate(-90)">${g}</g>${lb}
    <text x="150" y="104" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">${tp ? esc(top[0]) : "Belum ada data"}</text>
    <text x="150" y="117" text-anchor="middle" style="font-size:8.5px">(Satuan Juta Rupiah)</text>
    <text x="150" y="142" text-anchor="middle" style="fill:var(--ink);font-size:24px;font-weight:800">${tp ? (top[1] / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) : "0"}</text>
  </svg>`;
}

function cPie(a, b) {
  const t = a + b;
  if (!t) return '<div class="empty">Belum ada beban.</div>';
  const R = 86, f = a / t, e = 2 * Math.PI * f - Math.PI / 2;
  const x = 105 + R * Math.cos(e), y = 105 + R * Math.sin(e), big = f > 0.5 ? 1 : 0;
  return `<svg viewBox="0 0 210 210" width="100%" style="max-width:200px" role="img" aria-label="Komposisi beban usaha">
    ${
      !b
        ? `<circle cx="105" cy="105" r="${R}" fill="#12ab92"/>`
        : !a
        ? `<circle cx="105" cy="105" r="${R}" fill="#f26b3a"/>`
        : `<path d="M105 105 L105 ${105 - R} A${R} ${R} 0 ${big} 1 ${x} ${y} Z" fill="#12ab92"/>
           <path d="M105 105 L${x} ${y} A${R} ${R} 0 ${1 - big} 1 105 ${105 - R} Z" fill="#f26b3a"/>`
    }
  </svg>`;
}

      </div>
    </div>

    <div class="k4">
      ${kt("Total Revenue", "", nf(rev), "Pendapatan Month to Month", pf(mm), mm == null || mm >= 0 ? hij : mrh)}
      ${kt("Total Expenses", "", nf(exp), "Beban Usaha atas Pendapatan", pf(er), er == null || er < 80 ? hij : mrh)}
      ${kt("Laba Bersih Usaha", "", `<span style="color:${laba < 0 ? mrh : "inherit"}">${laba < 0 ? "-" : ""}${nf(Math.abs(laba))}</span>`, "Laba / Rugi Dihasilkan =", pf(lm), lm == null || lm >= 0 ? hij : mrh)}
      <div class="dc">

        <div class="cf"><span>Debet</span><b>${nf(c.m)}</b><span>Kredit</span><b>${nf(c.k)}</b><span>Balance</span><b>${c.m - c.k < 0 ? "-" : ""}${nf(Math.abs(c.m - c.k))}</b></div>
        <div class="df"><span>Dana Shopee belum cair</span><b>${nf(PS().L.reduce((x, y) => x + y.net - y.bayar, 0))}</b></div>

function nr() {
  const M = S.bln == "ytd" ? 11 : +S.bln;
  const m = {};
  semua().forEach(j => {
    const d = dt(j.tgl), y = d.getFullYear();
    if (y > S.thn || (y == S.thn && d.getMonth() > M)) return;
    (j.lines || []).forEach(l => {
      m[l.akun] = (m[l.akun] || 0) + (l.d || 0) - (l.k || 0);
    });
  });
  let labaLalu = 0;
  semua().forEach(j => {
    if (dt(j.tgl).getFullYear() < S.thn) (j.lines || []).forEach(l => { if (l.akun[0] >= "4") labaLalu -= (l.d || 0) - (l.k || 0); });
  });
  const laba = -Object.keys(m).filter(k => k[0] >= "4").reduce((s, k) => s + m[k], 0) - labaLalu;
  const adaLT = AK.M.a.some(a => a[0] == "3-30100");
  const f = x => (x < 0 ? "(" + Math.abs(Math.round(x)).toLocaleString("id-ID") + ")" : x ? Math.round(x).toLocaleString("id-ID") : "–");
  const val = (k, sg) => sg * (m[k] || 0) + (k == "3-30201" ? laba + (adaLT ? 0 : labaLalu) : 0) + (k == "3-30100" && adaLT ? labaLalu : 0);
  const bar = (g, fl, sg) =>
    AK[g].a
      .filter(a => fl(a[0]))
      .map(a => `<tr><td class="kd">${a[0].replace("-", "–")}</td><td>${esc(a[1])}</td><td class="nm">${f(val(a[0], sg))}</td></tr>`)
      .join("");
  const sum = (g, fl, sg) => AK[g].a.filter(a => fl(a[0])).reduce((s, a) => s + val(a[0], sg), 0);
  const blok = (jd, g, fl, sg, tj, c) =>
    `<tr class="${c || "sh"}"><td colspan="3">${jd}</td></tr>` +
    bar(g, fl, sg) +
    `<tr class="tt"><td colspan="2">${tj}</td><td class="nm">${f(sum(g, fl, sg))}</td></tr>`;

  const lan = k => ["Kas & Bank", "Akun Piutang", "Persediaan", "Aktiva Lancar Lainnya"].includes(KAT[k]);
  const tet = k => KAT[k] == "Aktiva Tetap";
  const dep = k => KAT[k] == "Depresiasi & Amortisasi";
  const lai = k => KAT[k] == "Aktiva Lainnya";
  const pen = k => ["Akun Hutang", "Kewajiban Lancar Lainnya"].includes(KAT[k]);
  const pan = k => KAT[k] == "Kewajiban Jangka Panjang";
  const all = () => true;

  const tA = sum("A", all, 1), tL = sum("L", all, -1), tM = sum("M", all, -1);
  const sel = Math.round(tA - tL - tM);
  const tg = new Date(S.thn, M + 1, 0).getDate() + " " + BL[M] + " " + S.thn;

  return (
    periode()
      .replace("Satu tahun penuh (YTD)", "Akhir tahun (Desember)")
      .replace("<label>Periode", "<label>Posisi per akhir") +
    `<div class="panel rl scroll">
      <h2>LAPORAN NERACA (POSISI KEUANGAN)</h2>
      <div class="per">Posisi per ${tg}</div>
      <table>
        <tr class="sh"><td colspan="3">ASET</td></tr>
        ${blok("ASET LANCAR", "A", lan, 1, "Total Aset Lancar", "sb")}
        ${blok("ASET TETAP", "A", tet, 1, "Total Aset Tetap", "sb")}
        ${blok("DEPRESIASI & AMORTISASI", "A", dep, 1, "Total Depresiasi & Amortisasi", "sb")}
        ${blok("LAIN-LAIN", "A", lai, 1, "Total Lain-lain", "sb")}
        <tr class="big"><td colspan="2">TOTAL ASET</td><td class="nm">${f(tA)}</td></tr>
        <tr class="sh"><td colspan="3">LIABILITAS DAN MODAL</td></tr>
        ${blok("Liabilitas Jangka Pendek", "L", pen, -1, "Total Liabilitas Jangka Pendek", "sb")}
        ${blok("Liabilitas Jangka Panjang", "L", pan, -1, "Total Liabilitas Jangka Panjang", "sb")}
        ${blok("MODAL PEMILIK", "M", all, -1, "Total Modal Pemilik", "sb")}
        <tr class="big"><td colspan="2">TOTAL LIABILITAS DAN MODAL</td><td class="nm">${f(tL + tM)}</td></tr>
      </table>
      <p class="per"><span class="badge ${sel ? "no" : "ok"}">${sel ? "Belum seimbang · Selisih " + rp(sel) : "✓ Neraca Seimbang (Balance)"}</span></p>
      <div class="per">Laba/Rugi Tahun Berjalan mencakup laba bersih tahun ini sampai tanggal laporan; laba tahun-tahun sebelumnya otomatis masuk Laba Ditahan.</div>
    </div>`
  );
}

function arusKas() {
  const ms = S.bln == "ytd" ? [...Array(12).keys()] : [+S.bln];
  const per = S.bln == "ytd" ? "Januari – Desember " + S.thn : BL[+S.bln] + " " + S.thn;
  const kasSet = new Set(KAS.map(a => a[0]));
  let masukOp = 0, keluarHpp = 0, keluarBeb = 0, masukInv = 0, keluarInv = 0, masukFin = 0, keluarFin = 0;

  semua().forEach(j => {
    const d = dt(j.tgl);
    if (d.getFullYear() != S.thn || !ms.includes(d.getMonth())) return;
    const lines = j.lines || [];
    const kasDelta = lines.filter(l => kasSet.has(l.akun)).reduce((s, l) => s + (l.d || 0) - (l.k || 0), 0);
    if (!kasDelta) return;
    const lawan = lines.filter(l => !kasSet.has(l.akun));
    lawan.forEach(l => {
      const k0 = l.akun[0];
      const amt = (l.k || 0) - (l.d || 0);
      if (k0 == "1" && KAT[l.akun] == "Aktiva Tetap") {
        if (amt >= 0) masukInv += amt; else keluarInv += -amt;
      } else if (k0 == "3" || KAT[l.akun] == "Kewajiban Jangka Panjang" || ["2-20202","2-20204","2-20205"].includes(l.akun)) {
        if (amt >= 0) masukFin += amt; else keluarFin += -amt;
      } else if (k0 == "5" || l.akun == "1-10200" || l.akun == "2-20100") {
        if (amt >= 0) masukOp += amt; else keluarHpp += -amt;
      } else if (k0 == "6") {
        if (amt >= 0) masukOp += amt; else keluarBeb += -amt;
      } else {
        if (amt >= 0) masukOp += amt; else keluarBeb += -amt;
      }
    });
  });

  const netOp = masukOp - keluarHpp - keluarBeb;
  const netInv = masukInv - keluarInv;
  const netFin = masukFin - keluarFin;
  const kenaikan = netOp + netInv + netFin;
  const tAwal = S.thn + "-" + String((S.bln == "ytd" ? 0 : +S.bln) + 1).padStart(2, "0") + "-01";
  const tAkhir = S.thn + "-" + String((S.bln == "ytd" ? 11 : +S.bln) + 1).padStart(2, "0") + "-31";
  let sAwal = 0, sAkhir = 0;
  semua().forEach(j => {
    const t = String(j.tgl).slice(0, 10);
    (j.lines || []).forEach(l => {
      if (!kasSet.has(l.akun)) return;
      const v = (l.d || 0) - (l.k || 0);
      if (t < tAwal) sAwal += v;
      if (t <= tAkhir) sAkhir += v;
    });
  });
  const selKas = Math.round(sAwal + kenaikan - sAkhir);
  const f = x => (x < 0 ? "(" + Math.abs(Math.round(x)).toLocaleString("id-ID") + ")" : x ? Math.round(x).toLocaleString("id-ID") : "–");

  return (
    periode() +
    `<div class="panel rl scroll">
      <h2>LAPORAN ARUS KAS (METODE LANGSUNG)</h2>
      <div class="per">Periode ${per}</div>
      <table>
        <tr class="sh"><td colspan="2">ARUS KAS DARI AKTIVITAS OPERASIONAL</td></tr>
        <tr><td>Penerimaan Kas dari Pelanggan &amp; Pencairan Platform</td><td class="nm">${f(masukOp)}</td></tr>
        <tr><td>Pembayaran Kas untuk Persediaan &amp; Supplier</td><td class="nm">${f(-keluarHpp)}</td></tr>
        <tr><td>Pembayaran Kas untuk Beban Operasional, Gaji &amp; Pajak</td><td class="nm">${f(-keluarBeb)}</td></tr>
        <tr class="tt"><td>Arus Kas Bersih dari Aktivitas Operasional</td><td class="nm">${f(netOp)}</td></tr>

        <tr class="sh"><td colspan="2">ARUS KAS DARI AKTIVITAS INVESTASI</td></tr>
        <tr><td>Penerimaan / Pelepasan Aset Tetap</td><td class="nm">${f(masukInv)}</td></tr>
        <tr><td>Perolehan Aset Tetap &amp; Peralatan</td><td class="nm">${f(-keluarInv)}</td></tr>
        <tr class="tt"><td>Arus Kas Bersih dari Aktivitas Investasi</td><td class="nm">${f(netInv)}</td></tr>

        <tr class="sh"><td colspan="2">ARUS KAS DARI AKTIVITAS PENDANAAN</td></tr>
        <tr><td>Setoran Modal &amp; Pinjaman Jangka Panjang</td><td class="nm">${f(masukFin)}</td></tr>
        <tr><td>Prive / Pembayaran Pinjaman &amp; Dividen</td><td class="nm">${f(-keluarFin)}</td></tr>
        <tr class="tt"><td>Arus Kas Bersih dari Aktivitas Pendanaan</td><td class="nm">${f(netFin)}</td></tr>

        <tr class="big"><td>KENAIKAN / (PENURUNAN) BERSIH KAS DAN BANK</td><td class="nm ${kenaikan < 0 ? "neg" : ""}">${f(kenaikan)}</td></tr>
        <tr><td>Saldo Kas dan Bank Awal Periode</td><td class="nm">${f(sAwal)}</td></tr>
        <tr class="big"><td>SALDO KAS DAN BANK AKHIR PERIODE</td><td class="nm">${f(sAwal + kenaikan)}</td></tr>
      </table>

    </div>`
  );
}

function bukuBesar() {
  const ak = S.glAkun || "1-10100";
  const normalKredit = ["2", "3", "4"].includes(ak[0]);
  let saldo = 0;
  const rows = [];
  semua()
    .sort((a, b) => a.tgl.localeCompare(b.tgl) || a.id.localeCompare(b.id))
    .forEach(j => {
      (j.lines || []).forEach(l => {
        if (l.akun == ak) {
          const d = l.d || 0, k = l.k || 0;
          saldo += normalKredit ? k - d : d - k;
          rows.push({ tgl: j.tgl, ket: j.ket, d, k, saldo, auto: j.auto });
        }
      });
    });

  return `<div class="bar">
    <label>Pilih Akun Buku Besar
      <select id="gl-akun">${opsi().replace(`value="${ak}"`, `value="${ak}" selected`)}</select>
    </label>
  </div>
  <div class="panel scroll">
    <h2>Buku Besar: ${esc(ak)} — ${esc(nama(ak))} <span class="badge ok">Saldo Akhir: ${rp(saldo)}</span></h2>
    ${
      rows.length
        ? `<table>
            <thead><tr><th>Tanggal</th><th>Keterangan</th><th>Sumber</th><th>Debet</th><th>Kredit</th><th>Saldo (${normalKredit ? "Kredit" : "Debet"})</th></tr></thead>
            <tbody>${rows
              .map(
                r => `<tr>
                  <td>${r.tgl}</td>
                  <td style="text-align:left">${esc(r.ket)}</td>
                  <td>${r.auto ? "Otomatis" : "Manual"}</td>
                  <td>${r.d ? rp(r.d) : "–"}</td>
                  <td>${r.k ? rp(r.k) : "–"}</td>
                  <td><b>${rp(r.saldo)}</b></td>
                </tr>`
              )
              .join("")}</tbody>
          </table>`
        : `<div class="empty">Belum ada mutasi pada akun ini.</div>`
    }
  </div>`;
}

function cek() {
  const gl = k =>
    semua().reduce(
      (s, j) => s + (j.lines || []).filter(l => l.akun == k).reduce((a, l) => a + (l.d || 0) - (l.k || 0), 0),
      0
    );
  const sisa = (t, ak) =>
    HP.filter(h => h.tipe == t && (h.akun || (t == "hutang" ? "2-20100" : "1-10100")) == ak).reduce(
      (s, h) => s + h.nom - (h.bayar || 0),
      0
    );
  const H = HPPM(), C = [];
  const ok = x => Math.round(x) == 0;

  const tb = JR.filter(j => !ok((j.lines || []).reduce((a, l) => a + (l.d || 0) - (l.k || 0), 0))).length;
  C.push(["Semua jurnal seimbang (debet = kredit)", !tb, tb ? tb + " jurnal tidak seimbang" : "Sesuai"]);

  const pu = gl("1-10100");
  const ps = PS().L.reduce((s, x) => s + x.net - x.bayar, 0) + sisa("piutang", "1-10100");
  C.push(["Piutang Usaha di buku besar = rincian piutang (Shopee dan manual)", ok(pu - ps), "Buku besar " + rp(pu) + " · rincian " + rp(ps)]);

  const hu = -gl("2-20100"), hs = sisa("hutang", "2-20100");
  C.push(["Hutang Usaha di buku besar = rincian hutang", ok(hu - hs), "Buku besar " + rp(hu) + " · rincian " + rp(hs)]);

  const pe = gl("1-10200"), pv = Object.values(H.st).reduce((s, x) => s + x.v, 0);
  C.push(["Persediaan Barang di buku besar = nilai stok (rata-rata bergerak)", ok(pe - pv), "Buku besar " + rp(pe) + " · nilai stok " + rp(pv)]);

  const jual = [...new Set(P.map(p => p.sku))], tan = jual.filter(k => !INV.some(i => i.sku == k));
  C.push(["Semua SKU terjual sudah ada di Persediaan", !tan.length, tan.length ? "Belum ada: " + tan.join(", ") : "Sesuai"]);

  const neg = Object.keys(H.st).filter(k => H.st[k].q < 0);
  C.push(["Tidak ada stok bernilai minus", !neg.length, neg.length ? "Stok minus: " + neg.join(", ") : "Sesuai"]);

  const tdb = semua().reduce((a, j) => a + (j.lines || []).reduce((b, l) => b + (l.d || 0) - (l.k || 0), 0), 0);
  C.push(["Total debet = total kredit seluruh jurnal (manual + otomatis)", ok(tdb), ok(tdb) ? "Sesuai" : "Selisih " + rp(tdb)]);
  const tdk = new Set();
  semua().forEach(j => (j.lines || []).forEach(l => { if (!(l.akun in KAT)) tdk.add(l.akun); }));
  HP.forEach(h => { [h.akun, h.lawan].forEach(a => { if (a && !(a in KAT)) tdk.add(a); }); });
  C.push(["Semua kode akun di transaksi terdaftar di Setup", !tdk.size, tdk.size ? "Tidak dikenal: " + [...tdk].join(", ") : "Sesuai"]);
  return `<div class="panel scroll">
    <h2>Cek Keterkaitan Data (Audit Akuntansi)</h2>
    <p style="color:var(--mut)">Membandingkan buku besar dengan rincian pendukung secara otomatis.</p>
    <table>
      <thead><tr><th>Pemeriksaan</th><th>Hasil</th><th>Rincian</th></tr></thead>
      <tbody>${C.map(
        c => `<tr>
          <td style="text-align:left">${esc(c[0])}</td>
          <td><span class="badge ${c[1] ? "ok" : "no"}">${c[1] ? "Sesuai" : "Perlu Dicek"}</span></td>
          <td style="text-align:left">${esc(c[2])}</td>
        </tr>`
      ).join("")}</tbody>
    </table>
  </div>`;
}

function hitJ() {
  let d = 0, k = 0;
  document.querySelectorAll("#j-baris .jl").forEach(r => {
    d += +r.querySelector(".jd").value || 0;
    k += +r.querySelector(".jk").value || 0;
  });
  const t = document.getElementById("j-tot");
  if (t) {
    t.textContent = "Debet " + rp(d) + " · Kredit " + rp(k) + (d == k && d > 0 ? " · ✓ Seimbang" : " · Selisih " + rp(Math.abs(d - k)));
    t.className = d == k && d > 0 ? "pos" : "neg";
  }
  return [d, k];
}

function bindJ() {
  const b = document.getElementById("j-baris");
  const pasang = () =>
    b.querySelectorAll(".jl").forEach(r => {
      r.oninput = hitJ;
      r.querySelector(".jx").onclick = () => {
        if (b.children.length > 2) {
          r.remove();
          hitJ();
        }
      };
    });
  pasang();
  hitJ();
  document.getElementById("j-tb").onclick = () => {
    b.insertAdjacentHTML("beforeend", barisJ());
    pasang();
    hitJ();
  };
  document.getElementById("j-simpan").onclick = () => {
    const e = document.getElementById("j-err"),
      t = document.getElementById("j-tgl").value,
      lines = [];
    let salah = "";
    b.querySelectorAll(".jl").forEach(r => {
      const rawVal = r.querySelector(".ja").value.trim();
      const aMatch = rawVal.split("—")[0].trim();
      const d = +r.querySelector(".jd").value || 0,
        k = +r.querySelector(".jk").value || 0;
      if (!rawVal && !d && !k) return;
      if (!rawVal || !AKUN.some(x => x.kode == aMatch)) salah = "Pilih atau ketik akun yang valid dari daftar.";
      else if (d && k) salah = "Satu baris hanya boleh debet atau kredit, tidak keduanya.";
      else if (!d && !k) salah = "Isi debet atau kredit untuk akun " + aMatch + ".";
      else lines.push(d ? { akun: aMatch, d, k: 0 } : { akun: aMatch, d: 0, k });
    });
    const [d, k] = hitJ();
    if (!salah && !t) salah = "Isi tanggal.";
    if (!salah && lines.length < 2) salah = "Jurnal butuh minimal dua baris.";
    if (!salah && d != k) salah = "Debet dan kredit harus sama. Selisih " + rp(Math.abs(d - k)) + ".";
    if (salah) {
      e.textContent = salah;
      return;
    }
    e.textContent = "";
    const rf = document.getElementById("j-ref").value.split("|");
    const doc = { id: uid(), tgl: t, ket: document.getElementById("j-ket").value.trim() || "Jurnal Umum", lines };
    if (rf[1]) {
      doc.ref = { tipe: rf[0], no: rf[1] };
      if (rf[0] === "piutang") {
        const totalKreditPiutang = lines.filter(l => l.akun === "1-10100" && l.k > 0).reduce((s, l) => s + l.k, 0);
        if (totalKreditPiutang > 0) {
          CA.push({
            id: uid(),
            tgl: t,
            toko: rf[1].includes("-KONG-") ? "kong" : "java",
            kode: rf[1],
            nom: totalKreditPiutang,
            akun: "1-10001"
          });
        }
      }
    }
    JR.push(doc);
    S.thn = dt(t).getFullYear();
    simpanLokal();
    info = "Jurnal berhasil disimpan dan terhubung ke buku besar.";
    draw();
  };
  document.querySelectorAll("[data-id]").forEach(x => (x.onclick = () => {
    JR = JR.filter(j => j.id != x.dataset.id);
    simpanLokal();
    draw();
  }));
  const cr = document.getElementById("jr-cari");
  if (cr) {
    cr.oninput = e => {
      S.jrQ = e.target.value;
      const pos = cr.selectionStart;
      draw();
      const el = document.getElementById("jr-cari");
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    };
  }
}

async function impor(files, tk) {
  if (typeof XLSX == "undefined") {
    LP = "<span class='neg'>Pembaca Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.</span>";
    return draw();
  }
  const MB = { jan:1, feb:2, mar:3, apr:4, mei:5, may:5, jun:6, jul:7, agu:8, agt:8, ags:8, aug:8, sep:9, okt:10, oct:10, nov:11, des:12, dec:12 };
  const AL = { MSGLOWULTIMATETAHAP1: "MUS" };
  const seen = new Set(P.map(p => p.no + "|" + p.sku));
  const ord = new Set(P.map(p => p.no));
  const lap = [], tak = new Set();
  let tb = 0, td = 0;

  const num = x => {
    if (typeof x == "number") return x;
    let t = String(x).replace(/[^0-9.,-]/g, "");
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "").replace(",", ".");
    else t = t.replace(/,/g, ".");
    return +t || 0;
  };

  for (const f of files) {
    const fnLow = f.name.toLowerCase();
    const mt = /(\d{1,2})[-_ ]([A-Za-z]{3,})[-_ ](\d{2,4})/.exec(f.name);
    const mo = mt && MB[mt[2].slice(0, 3).toLowerCase()];
    const tg = mo
      ? (+mt[3] < 100 ? 2000 + +mt[3] : +mt[3]) + "-" + String(mo).padStart(2, "0") + "-" + String(+mt[1]).padStart(2, "0")
      : hariIni();

    let targetToko = tk;
    if (targetToko == "auto") {
      if (/^jv/i.test(fnLow)) targetToko = "java";
      else if (/^mall|kf|kong/i.test(fnLow)) targetToko = "kong";
      else if (/^laz/i.test(fnLow)) targetToko = "lazada";
      else if (/^tik|tt/i.test(fnLow)) targetToko = "tiktok";
      else {
        lap.push(f.name + ": toko tidak bisa ditebak dari awalan nama file (gunakan awalan 'jv_' atau 'mall_'). Dilewati.");
        continue;
      }
    }

    let rows;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
    } catch (x) {
      lap.push(f.name + ": file tidak bisa dibaca. Dilewati.");
      continue;
    }
    const hi = rows.findIndex(r => r.some(c => String(c).trim().toLowerCase() == "nomor pesanan"));
    if (hi < 0) {
      lap.push(f.name + ": kolom 'Nomor Pesanan' tidak ditemukan. Dilewati.");
      continue;
    }
    const hd = rows[hi].map(c => String(c).trim().toLowerCase());
    const C = {
      no: hd.indexOf("nomor pesanan"),
      sku: hd.indexOf("sku"),
      jml: hd.indexOf("jumlah"),
      hrg: hd.indexOf("harga satuan"),
      vc: hd.indexOf("voucher toko"),
      adm: hd.indexOf("biaya pengelolaan")
    };
    const ks = ["sku", "jml", "hrg"].filter(k => C[k] < 0);
    if (ks.length) {
      lap.push(f.name + ": kolom tidak ditemukan (" + ks.join(", ") + "). Dilewati.");
      continue;
    }
    let baruCount = 0, dobel = 0;
    rows.slice(hi + 1).forEach(r => {
      const no = String(r[C.no]).trim(), s0 = String(r[C.sku]).trim();
      if (!no || !s0) return;
      let sku = AL[s0] || s0;
      
      if (!SKUS.some(x => x.sku == sku)) {
        const prefixSku = s0.split(/[-_\s]/)[0].toUpperCase();
        if (SKUS.some(x => x.sku == prefixSku)) {
          sku = prefixSku;
        } else {
          tak.add(sku);
        }
      }

      if (seen.has(no + "|" + sku)) {
        dobel++;
        return;
      }
      seen.add(no + "|" + sku);
      const awal = !ord.has(no);
      ord.add(no);
      P.push({
        tgl: tg,
        toko: targetToko,
        no,
        sku,
        jml: num(r[C.jml]),
        hrg: num(r[C.hrg]),
        vc: awal ? (C.vc >= 0 ? num(r[C.vc]) : 0) : null,
        adm: awal ? (C.adm >= 0 ? num(r[C.adm]) : 0) : null
      });
      baruCount++;
    });
    td += dobel;
    tb += baruCount;
    lap.push(`• <b>${labelToko(targetToko)}</b>: ${baruCount} transaksi berhasil (${tg})` + (dobel ? ` [${dobel} duplikat dilewati]` : ""));
  }
  if (tak.size) lap.push(`Perhatian: ${tak.size} SKU baru belum terdaftar di setup.`);
  simpanLokal();
  LP = `<b>Impor Selesai: ${tb} data berhasil dimuat.</b><br>` + lap.join("<br>");
  draw();
}

  const tkSelect = document.getElementById("tk");
  if (tkSelect) {

  }
  const tkFilter = document.getElementById("tk-filter");
  if (tkFilter) {
    tkFilter.onchange = e => { S.toko = e.target.value; draw(); };
  }
  bindP();

  const tipeInp = document.getElementById("m-tipe");
  const grpJual = document.getElementById("m-group-jual");
  if (tipeInp && grpJual) {
    tipeInp.onchange = () => {
      grpJual.style.display = tipeInp.value === "retur" ? "none" : "contents";
    };
  }

  document.getElementById("u-go").onclick = async () => {
    const fl = [...document.getElementById("u-file").files];
    const o = document.getElementById("u-out");
    if (!fl.length) {
      o.innerHTML = "<span class='neg'>Pilih satu atau beberapa file Excel dulu.</span>";

    await impor(fl, document.getElementById("u-toko").value);
  };
const tpl = document.getElementById("u-tpl");
if (tpl) {
  tpl.onclick = () => {
    if (typeof XLSX === "undefined") {
      alert("Library Excel (SheetJS) sedang dimuat. Pastikan ada koneksi internet lalu coba lagi.");
      return;
    }
    const ws = XLSX.utils.aoa_to_sheet([
      ["Nomor Pesanan", "SKU", "Jumlah", "Harga Satuan", "Voucher Toko", "Biaya Pengelolaan"],
      ["261005JV801", "MUS", 2, 270000, 15000, 32000],
      ["261005JV802", "HAS", 5, 14500, 0, 5000]
    ]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Penjualan");
    simpanXlsx(wb, "jv-5-okt-2026.xlsx");
  };
}
  document.getElementById("m-add").onclick = () => {
    const el = id => document.getElementById("m-" + id);
    const v = id => (el(id) ? el(id).value : "");
    const err = document.getElementById("m-err");
    const tipe = el("tipe") ? el("tipe").value : "jual";
    const tgl = v("tgl"), toko = v("toko"), no = v("no").trim();

    if (!tgl || !no) {
      if (err) err.textContent = "Lengkapi tanggal dan nomor pesanan.";
      return;
    }

    if (tipe === "retur") {
      const targetItems = P.filter(p => p.no.toLowerCase() === no.toLowerCase());
      if (!targetItems.length) {
        if (err) err.textContent = "Nomor pesanan '" + no + "' tidak ditemukan dalam data penjualan.";
        return;
      }
      if (err) err.textContent = "";
      targetItems.forEach(orig => {
        P.push({
          tgl,
          toko: orig.toko || toko,
          no: orig.no + "-RET",
          sku: orig.sku,
          jml: -Math.abs(orig.jml),
          hrg: orig.hrg,
          vc: orig.vc ? -Math.abs(orig.vc) : null,
          adm: orig.adm ? -Math.abs(orig.adm) : null
        });
      });
      S.thn = dt(tgl).getFullYear();
      simpanLokal();
      info = "Retur untuk No. Pesanan " + no + " berhasil dicatat dan stok serta laporan otomatis menyesuaikan.";
      draw();
    } else {
      const sku = v("sku").trim();
      let jml = +v("jml"), hrg = +v("hrg"), vc = +v("vc") || 0, adm = +v("adm") || 0;
      if (!sku || !(jml > 0) || !(hrg >= 0)) {
        if (err) err.textContent = "Lengkapi SKU, jumlah, dan harga satuan.";
        return;
      }
      if (err) err.textContent = "";
      P.push({ tgl, toko, no, sku, jml, hrg, vc, adm });
      S.thn = dt(tgl).getFullYear();
      simpanLokal();
      info = "Penjualan pesanan " + no + " berhasil dicatat.";
      draw();
    }
  };

  document.querySelectorAll("[data-k]").forEach(b => (b.onclick = () => {
    const [t, g, no, sku] = b.dataset.k.split("|");
    const idx = P.findIndex(x => (x.toko || "java") == t && x.tgl == g && x.no == no && x.sku == sku);
    if (idx >= 0) {
      P.splice(idx, 1);
      simpanLokal();
      draw();
    }
  }));
}

    ${
      CA.length
        ? `<h2 style="margin-top:20px">Riwayat Pencairan Dana Shopee</h2>
           <table>
            <thead><tr><th>Tanggal Cair</th><th>Toko</th><th>Kode Piutang</th><th>Nominal Cair</th><th>Masuk ke Rekening</th><th></th></tr></thead>

function bindH() {
  const flSp = document.getElementById("sp-filter-toko");
  if (flSp) {
    flSp.onchange = e => {
      S.spToko = e.target.value;
      draw();
    };
  }
  const flSt = document.getElementById("sp-filter-status");
  if (flSt) {
    flSt.onchange = e => {
      S.spStatus = e.target.value;
      draw();
    };
  }
  document.querySelectorAll("[data-cairkan]").forEach(btn => {
    btn.onclick = () => {
      const [tk, kd, sisa] = btn.dataset.cairkan.split("|");
      const sel = document.getElementById("c-target");
      const nomInp = document.getElementById("c-nom");
      if (sel) sel.value = tk + "|" + kd;
      if (nomInp) {
        nomInp.value = sisa;
        nomInp.focus();
      }
    };
  });
  document.getElementById("h-add").onclick = () => {
    const v = i => document.getElementById("h-" + i).value;
    const e = document.getElementById("h-err"), t = v("tipe"), nom = +v("nom");
    if (!v("pihak").trim() || !v("tgl") || !(nom > 0)) {
      e.textContent = "Isi nama pihak, tanggal, dan nominal.";
      return;
    }
    if (v("akun") == v("lawan")) {
      e.textContent = "Akun lawan harus berbeda dari akun hutang/piutang.";
      return;
    }
    if (v("akun")[0] != (t == "hutang" ? "2" : "1")) {
      e.textContent = t == "hutang" ? "Hutang harus memakai akun berawalan 2-." : "Piutang harus memakai akun aset berawalan 1-.";
      return;
    }
    const mx = Math.max(0, ...HP.filter(h => h.tipe == t).map(h => +String(h.no).slice(2) || 0));
    const no = (t == "hutang" ? "H-" : "P-") + String(mx + 1).padStart(3, "0");
    HP.push({
      id: uid(),
      tipe: t,
      no,
      pihak: v("pihak").trim(),
      tgl: v("tgl"),
      tempo: v("tempo"),
      nom,
      bayar: 0,
      ket: v("ket"),
      akun: v("akun"),
      lawan: v("lawan"),
      log: []
    });
    simpanLokal();
    draw();
  };
  document.querySelectorAll("[data-hd]").forEach(b => (b.onclick = () => {
    HP = HP.filter(h => h.id != b.dataset.hd);
    simpanLokal();
    draw();
  }));
  document.getElementById("y-add").onclick = () => {
    const e = document.getElementById("y-err");
    const h = HP.find(x => x.id == document.getElementById("y-id").value);
    const nom = +document.getElementById("y-nom").value;
    const tgl = document.getElementById("y-tgl").value;
    if (!h) {
      e.textContent = "Pilih hutang atau piutang yang dibayar.";
      return;
    }
    if (!tgl || !(nom > 0)) {
      e.textContent = "Isi tanggal dan nominal.";
      return;
    }
    if (nom > h.nom - (h.bayar || 0)) {
      e.textContent = "Nominal melebihi sisa (" + rp(h.nom - (h.bayar || 0)) + ").";
      return;
    }
    h.bayar = (h.bayar || 0) + nom;
    h.log = [...(h.log || []), { tgl, nom, akun: document.getElementById("y-akun").value }];
    simpanLokal();
    draw();
  };
  document.getElementById("c-add").onclick = () => {
    const e = document.getElementById("c-err"),
      nom = +document.getElementById("c-nom").value,
      tgl = document.getElementById("c-tgl").value,
      target = (document.getElementById("c-target").value || "java|").split("|");
    const toko = target[0] || "java";
    const kode = target[1] || "";
    if (!tgl || !(nom > 0)) {
      e.textContent = "Isi tanggal dan nominal pencairan.";
      return;
    }
    const item = { id: uid(), tgl, toko, nom, akun: document.getElementById("c-akun").value };
    if (kode) item.kode = kode;
    CA.push(item);
    simpanLokal();
    info = "Pencairan dana Shopee " + labelToko(toko) + (kode ? " (" + kode + ")" : "") + " sebesar " + rp(nom) + " berhasil dicatat.";
    draw();
  };
  document.querySelectorAll("[data-cd]").forEach(b => (b.onclick = () => {
    CA = CA.filter(c => c.id != b.dataset.cd);
    simpanLokal();
    draw();
  }));
}

  BE.forEach(b => { ms[b.sku] = (ms[b.sku] || 0) + b.jml; });

        <tbody>${INV.map((i, n) => ({ i, n }))

            const buku = i.stok + (ms[i.sku] || 0) - (jl[i.sku] || 0) + penyesuaian;
            const infoSt = stMap[i.sku] || { l: i.hrg, v: buku * i.hrg };
            const isEd = S.editInv === i.sku;

function terapkanOpname() {
  const jl = {}, ms = {}, adj = {};
  P.forEach(p => { jl[p.sku] = (jl[p.sku] || 0) + p.jml; });
  BE.forEach(b => { ms[b.sku] = (ms[b.sku] || 0) + b.jml; });
  OP.forEach(o => { adj[o.sku] = (adj[o.sku] || 0) + o.diff; });
  const stMap = HPPM().st;
  const tgl = document.getElementById("op-tgl")?.value || S.opTgl || hariIni();
  S.opTgl = tgl;

  let count = 0;
  INV.forEach(i => {
    const raw = S.opDraft[i.sku];
    if (raw === undefined || raw === "" || isNaN(+raw)) return;
    const aktual = Math.max(0, Math.round(+raw));
    const buku = i.stok + (ms[i.sku] || 0) - (jl[i.sku] || 0) + (adj[i.sku] || 0);
    const diff = aktual - buku;
    if (diff !== 0) {
      const hrgUnit = (stMap[i.sku] && stMap[i.sku].l) || i.hrg || 0;
      OP.push({
        id: uid() + "_" + i.sku,
        tgl,
        sku: i.sku,
        buku,
        aktual,
        diff,
        hrg: hrgUnit
      });
      count++;
    }
  });

  S.opDraft = {};
  if (count > 0) {
    simpanLokal();
    S.opMsg = `<span class="pos">✓ <b>${count} SKU</b> berhasil disesuaikan ke stok aktual pada tanggal ${esc(tgl)} dan Jurnal Penyesuaian Persediaan telah tercatat otomatis!</span>`;
    info = count + " SKU berhasil direkonsiliasi sesuai stok opname aktual.";
  } else {
    S.opMsg = `<span class="warn">Tidak ada selisih antara stok buku dan stok aktual yang diisi.</span>`;
  }
  draw();
}

function bindV() {
  const tglOp = document.getElementById("op-tgl");
  if (tglOp) tglOp.onchange = e => { S.opTgl = e.target.value; };

  const btnTpl = document.getElementById("op-tpl");
  if (btnTpl && typeof XLSX !== "undefined") {
    btnTpl.onclick = () => {
      const jl = {}, ms = {}, adj = {};
      P.forEach(p => { jl[p.sku] = (jl[p.sku] || 0) + p.jml; });
      BE.forEach(b => { ms[b.sku] = (ms[b.sku] || 0) + b.jml; });
      OP.forEach(o => { adj[o.sku] = (adj[o.sku] || 0) + o.diff; });

      const rows = [["Kode SKU", "Nama Barang", "Stok Buku Saat Ini", "Jumlah Stok"]];
      INV.forEach(i => {
        const buku = i.stok + (ms[i.sku] || 0) - (jl[i.sku] || 0) + (adj[i.sku] || 0);
        rows.push([i.sku, i.nama, buku, buku]);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Stock Opname");
      simpanXlsx(wb, "Template_Stock_Opname_" + (S.opTgl || hariIni()) + ".xlsx");
    };
  }

  const btnUp = document.getElementById("op-upload");
  if (btnUp) {
    btnUp.onclick = async () => {
      const f = document.getElementById("op-file")?.files[0];
      if (!f) {
        S.opMsg = `<span class="neg">Pilih file Excel hasil Stock Opname terlebih dahulu.</span>`;
        draw();
        return;
      }
      if (typeof XLSX === "undefined") {
        S.opMsg = `<span class="neg">Pustaka pembaca Excel belum termuat. Periksa koneksi internet Anda.</span>`;
        draw();
        return;
      }
      try {
        const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
        if (!rows.length) {
          S.opMsg = `<span class="neg">File Excel kosong.</span>`;
          draw();
          return;
        }
        let hi = rows.findIndex(r =>
          r.some(c => /sku|kode/i.test(String(c))) && r.some(c => /stok|aktual|fisik|jumlah|qty|opname/i.test(String(c)))
        );
        let cSku = 0, cQty = 1, cNama = -1;
        if (hi >= 0) {
          const hd = rows[hi].map(c => String(c).trim().toLowerCase());
          cSku = hd.findIndex(h => h.includes("sku") || h.includes("kode"));
          cQty = hd.findIndex(h => (h.includes("jumlah") || h.includes("aktual") || h.includes("fisik") || h.includes("opname")) && !h.includes("buku"));
          if (cQty < 0) cQty = hd.findIndex((h, idx) => idx !== cSku && (h.includes("stok") || h.includes("qty")));
          cNama = hd.findIndex(h => h.includes("nama"));
          if (cSku < 0) cSku = 0;
          if (cQty < 0) cQty = cSku === 0 ? 1 : 0;
        } else {
          hi = -1;
        }

        let cocok = 0, baru = 0;
        rows.slice(hi + 1).forEach(r => {
          const rawSku = String(r[cSku] ?? "").trim();
          const rawQty = r[cQty];
          if (!rawSku || rawQty === "" || rawQty == null) return;
          const qty = Math.max(0, Math.round(+String(rawQty).replace(/[^0-9.-]/g, "") || 0));
          let item = INV.find(i => i.sku.toLowerCase() === rawSku.toLowerCase());
          if (!item) {
            const master = SKUS.find(s => s.sku.toLowerCase() === rawSku.toLowerCase());
            const nm = (cNama >= 0 && String(r[cNama] || "").trim()) || (master ? master.nama : rawSku);
            item = { sku: master ? master.sku : rawSku, nama: nm, stok: 0, hrg: 0 };
            INV.push(item);
            if (!master) SKUS.push({ sku: item.sku, nama: item.nama });
            baru++;
          }
          S.opDraft[item.sku] = qty;
          cocok++;
        });
        simpanLokal();
        S.opMsg = `<span class="pos">✓ Berhasil memuat <b>${cocok} SKU</b> dari file Excel${baru ? ` (${baru} SKU baru ditambahkan otomatis)` : ""}. Periksa kolom <b>Selisih</b> di bawah lalu klik <b>Terapkan Rekonsiliasi</b>.</span>`;
        draw();
      } catch (err) {
        S.opMsg = `<span class="neg">Gagal membaca file Excel: ${esc(err.message || "format tidak dikenali")}.</span>`;
        draw();
      }
    };
  }

  const btnApply = document.getElementById("op-apply");
  if (btnApply) btnApply.onclick = terapkanOpname;
  const btnApplyTop = document.getElementById("op-apply-top");
  if (btnApplyTop) btnApplyTop.onclick = terapkanOpname;

  const btnClear = document.getElementById("op-clear");
  if (btnClear) {
    btnClear.onclick = () => {
      S.opDraft = {};
      S.opMsg = "";
      draw();
    };
  }

  document.querySelectorAll("[data-opdel]").forEach(b => {
    b.onclick = () => {
      OP = OP.filter(o => o.id !== b.dataset.opdel);
      simpanLokal();
      info = "Catatan penyesuaian stock opname dibatalkan.";
      draw();
    };
  });

  const tbl = document.getElementById("tbl-inv");
  if (tbl) {
    tbl.onchange = ev => {
      const inp = ev.target.closest("input[data-opsku]");
      if (!inp) return;
      const sku = inp.dataset.opsku;
      if (inp.value === "") delete S.opDraft[sku];
      else S.opDraft[sku] = Math.max(0, Math.round(+inp.value || 0));
      draw();
    };

    tbl.onclick = ev => {
      const b = ev.target.closest("button");
      if (!b) return;
      if (b.dataset.iedit) {
        S.editInv = b.dataset.iedit;
        draw();
      } else if (b.dataset.icancel) {
        S.editInv = null;
        draw();
      } else if (b.dataset.isave != null) {
        const idx = +b.dataset.isave;
        const item = INV[idx];
        if (item) {
          const nm = document.getElementById("ie-nama");
          const st = document.getElementById("ie-stok");
          const hg = document.getElementById("ie-hrg");
          if (nm) item.nama = nm.value.trim() || item.nama;
          if (st) item.stok = Math.max(0, +st.value || 0);
          if (hg) item.hrg = Math.max(0, +hg.value || 0);
          S.editInv = null;
          simpanLokal();
          draw();
        }
      } else if (b.dataset.del != null) {
        INV.splice(+b.dataset.del, 1);
        S.editInv = null;
        simpanLokal();
        draw();
      }
    };
  }
  const sk = document.getElementById("v-sku");
  if (sk) {
    sk.oninput = () => {
      const x = SKUS.find(a => a.sku.toLowerCase() == sk.value.trim().toLowerCase());
      const n = document.getElementById("v-nama");
      if (x && n) n.value = x.nama;
    };
  }
  const addBtn = document.getElementById("v-add");
  if (addBtn) {
    addBtn.onclick = () => {
      const s = document.getElementById("v-sku").value.trim();
      const e = document.getElementById("v-err");
      if (!s) {
        e.textContent = "Isi SKU.";
        return;
      }
      if (INV.some(i => i.sku.toLowerCase() == s.toLowerCase())) {
        e.textContent = "SKU " + s + " sudah ada. Klik tombol Ubah pada baris tabel untuk mengedit.";
        return;
      }
      INV.push({
        sku: s,
        nama: document.getElementById("v-nama").value.trim() || s,
        stok: +document.getElementById("v-stok").value || 0,
        hrg: +document.getElementById("v-hrg").value || 0
      });
      simpanLokal();
      draw();
    };
  }
  const ivTpl = document.getElementById("iv-tpl");
  if (ivTpl) ivTpl.onclick = () => {
    if (typeof XLSX == "undefined") return;
    const rows = [["SKU", "Stok Awal", "Harga"]];
    INV.filter(i => !i.stok && !i.hrg).forEach(i => rows.push([i.sku, "", ""]));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Persediaan Awal");
    simpanXlsx(wb, "Template_Impor_Persediaan.xlsx");
  };
  const ivGo = document.getElementById("iv-go");
  if (ivGo) ivGo.onclick = async () => {
    const msg = h => { S.imMsg = h; draw(); };
    const f = document.getElementById("iv-file").files[0];
    if (!f) return msg('<span class="neg">Pilih file Excel terlebih dahulu.</span>');
    if (typeof XLSX == "undefined") return msg('<span class="neg">Pembaca Excel belum termuat. Periksa koneksi internet lalu muat ulang.</span>');
    let rows;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
    } catch (x) { return msg('<span class="neg">File tidak bisa dibaca.</span>'); }
    const hi = rows.findIndex(r => r.some(c => /^(sku|kode)/i.test(String(c).trim())));
    let cS = 0, cN = -1, cT = 1, cH = 2;
    if (hi >= 0) {
      const hd = rows[hi].map(c => String(c).trim().toLowerCase());
      const cari = fn => hd.findIndex(fn);
      cS = cari(h => h.startsWith("sku") || h.startsWith("kode"));
      cN = cari(h => h.includes("nama"));
      cT = cari(h => h.includes("stok") || h.includes("qty") || h.includes("jumlah"));
      cH = cari(h => h.includes("harga") || h.includes("modal") || h.includes("hpp"));
      const kurang = [cS < 0 && "SKU", cT < 0 && "Stok Awal", cH < 0 && "Harga"].filter(Boolean);
      if (kurang.length) return msg('<span class="neg">Kolom tidak ditemukan: ' + kurang.join(", ") + '. Gunakan template.</span>');
    }
    const num = x => {
      if (typeof x == "number") return x;
      let t = String(x).replace(/[^0-9.,-]/g, "");
      if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "").replace(",", ".");
      else t = t.replace(/,/g, ".");
      return t === "" ? 0 : +t;
    };
    const baru = [], isi = [], lewat = [], salah = [], tanpaMaster = [], seen = new Set();
    let tanpaHrg = 0;
    rows.slice(hi + 1).forEach((r, i) => {
      const sku = String(r[cS] ?? "").trim();
      if (!sku) return;
      const key = sku.toLowerCase(), br = hi + i + 2;
      if (seen.has(key)) { salah.push("baris " + br + ": SKU " + sku + " dobel di file"); return; }
      seen.add(key);
      const stok = num(r[cT]), hrg = num(r[cH]);
      if (!isFinite(stok) || !isFinite(hrg) || stok < 0 || hrg < 0) { salah.push("baris " + br + ": stok/harga tidak valid (" + sku + ")"); return; }
      const nm = cN >= 0 ? String(r[cN] ?? "").trim() : "";
      const ada = INV.find(x => x.sku.toLowerCase() == key);
      if (ada) { if (!ada.stok && !ada.hrg) isi.push({ ada, stok, hrg }); else lewat.push(sku); }
      else { baru.push({ sku, nama: nm, stok, hrg }); if (!SKUS.some(k => k.sku.toLowerCase() == key)) tanpaMaster.push(sku); }
      if (stok > 0 && !hrg) tanpaHrg++;
    });
    const n = baru.length + isi.length;
    const nilai = [...baru, ...isi].reduce((a, x) => a + x.stok * x.hrg, 0);
    const rincian = (judul, a) => a.length ? "<br>" + judul + ": " + a.slice(0, 5).map(esc).join("; ") + (a.length > 5 ? " … (+" + (a.length - 5) + ")" : "") : "";
    const detail = rincian("Dilewati (sudah ada stok/harga)", lewat) + rincian("Baris bermasalah", salah) + rincian("⚠️ SKU belum ada di master Setup (nama sementara = kode SKU, lengkapi di Setup → SKU)", tanpaMaster);
    if (!n) return msg('<span class="neg">Tidak ada produk yang bisa diimpor.</span>' + detail);
    const buatJr = document.getElementById("iv-jr").checked && nilai > 0;
    const tgl = document.getElementById("iv-tgl").value || hariIni();
    if (buatJr && !["1-10200", "3-30000"].every(k => AKUN.some(a => a.kode == k))) return msg('<span class="neg">Akun 1-10200 / 3-30000 tidak ada di Setup, jurnal saldo awal tidak bisa dibuat.</span>');
    const ok = await konfirmasi({
      judul: "Impor " + n + " produk?",
      isi: "<b>" + baru.length + "</b> produk baru, <b>" + isi.length + "</b> SKU lama diisi stok awal. Total nilai stok awal <b>" + rp(nilai) + "</b>." +
        (buatJr ? "<br>Jurnal saldo awal tanggal " + esc(tgl) + ": Debet Persediaan Barang, Kredit Modal Saham " + rp(nilai) + "." : "<br>Tanpa jurnal saldo awal.") +
        (tanpaHrg ? "<br>⚠️ " + tanpaHrg + " SKU bergudang tanpa harga modal, HPP-nya akan nol." : "") + detail,
      ya: "Ya, impor"
    });
    if (!ok) return;
    baru.forEach(x => {
      const m = SKUS.find(k => k.sku.toLowerCase() == x.sku.toLowerCase());
      const nama = m ? m.nama : (x.nama || x.sku);
      INV.push({ sku: m ? m.sku : x.sku, nama, stok: x.stok, hrg: x.hrg });
      if (!m) SKUS.push({ sku: x.sku, nama });
    });
    isi.forEach(x => { x.ada.stok = x.stok; x.ada.hrg = x.hrg; });
    if (buatJr) JR.push({ id: uid(), tgl, ket: "Saldo awal persediaan (impor Excel)", lines: [{ akun: "1-10200", d: nilai, k: 0 }, { akun: "3-30000", d: 0, k: nilai }] });
    simpanLokal();
    info = "Impor selesai: " + n + " produk masuk ke kartu persediaan.";
    S.imMsg = '<span class="pos">✓ ' + n + " produk diimpor (nilai stok awal " + rp(nilai) + ").</span>" + detail;
    draw();
  };
  const cr = document.getElementById("inv-cari");
  if (cr) {
    cr.oninput = e => {
      S.invQ = e.target.value;
      const pos = cr.selectionStart;
      draw();
      const el = document.getElementById("inv-cari");
      if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    };
  }
}

function simpanXlsx(wb, nama) {
  try {
    if (typeof XLSX !== "undefined" && XLSX.writeFile) {
      XLSX.writeFile(wb, nama);
      return;
    }
    const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    simpanFile(nama, wbout, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  } catch (e) {
    console.error("Gagal simpan XLSX:", e);
    info = "Gagal mengunduh " + nama + ": " + (e.message || e);
    draw();
  }
}

async function simpanFile(nama, data, mime = "application/octet-stream") {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nama;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.error("Gagal unduh file:", e);
    info = "Gagal mengunduh " + nama + ": " + (e.message || e);
    draw();
  }
}

function konfirmasi(o) {
  return new Promise(res => {
    const w = document.createElement("div");
    w.className = "no-print";
    w.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px";
    w.innerHTML = `<div role="alertdialog" aria-modal="true" aria-labelledby="kf-j" style="background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:14px;max-width:460px;width:100%;padding:22px;box-shadow:var(--shadow)">
      <h2 id="kf-j" style="margin:0 0 8px;font-size:18px">${esc(o.judul)}</h2>
      <div style="color:var(--mut);line-height:1.5;font-size:14px">${o.isi}</div>
      ${o.kata ? `<label style="display:block;margin-top:12px;font-size:13px">Ketik <b>${esc(o.kata)}</b> untuk melanjutkan<input id="kf-k" autocomplete="off" style="width:100%;margin-top:4px"></label>` : ""}
      ${o.cadangan ? `<p style="margin:12px 0 0"><button type="button" class="x" id="kf-b" style="color:var(--ac)">⬇️ Unduh cadangan dulu</button></p>` : ""}
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap">
        ${o.tanpaBatal ? "" : `<button type="button" class="btn alt" id="kf-n">Batal</button>`}
        <button type="button" class="btn" id="kf-y" ${o.kata ? "disabled" : ""} ${o.bahaya ? 'style="background:var(--neg);border-color:var(--neg);color:#fff"' : ""}>${esc(o.ya || "Lanjutkan")}</button>
      </div></div>`;
    document.body.appendChild(w);
    const q = id => w.querySelector("#" + id);
    const kb = e => { if (e.key == "Escape") tutup(false); };
    const tutup = v => { document.removeEventListener("keydown", kb); w.remove(); res(v); };
    document.addEventListener("keydown", kb);
    q("kf-y").onclick = () => tutup(true);
    if (q("kf-n")) q("kf-n").onclick = () => tutup(false);
    w.onclick = e => { if (e.target == w && !o.tanpaBatal) tutup(false); };
    if (q("kf-b")) q("kf-b").onclick = unduhCadangan;
    if (q("kf-k")) q("kf-k").oninput = e => { q("kf-y").disabled = e.target.value.trim().toUpperCase() != o.kata; };
    (q("kf-n") || q("kf-y")).focus();
  });
}
