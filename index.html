<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Keuangan 4Q26 — Keuangan Usaha Elzamora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f4f6f4;
  --sf: #ffffff;
  --sf2: #f9fbf9;
  --ink: #182625;
  --mut: #647573;
  --ln: #dce2de;
  --ac: #0f766e;
  --ac-hov: #0d635c;
  --neg: #c53030;
  --pos: #0f766e;
  --warn: #d97706;
  --shadow: 0 2px 6px rgba(24, 38, 37, 0.05), 0 1px 2px rgba(24, 38, 37, 0.04);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1716;
    --sf: #172322;
    --sf2: #1d2b2a;
    --ink: #e6efed;
    --mut: #94a6a3;
    --ln: #283836;
    --ac: #2dd4bf;
    --ac-hov: #14b8a6;
    --neg: #f87171;
    --pos: #34d399;
    --warn: #fbbf24;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1716;
  --sf: #172322;
  --sf2: #1d2b2a;
  --ink: #e6efed;
  --mut: #94a6a3;
  --ln: #283836;
  --ac: #2dd4bf;
  --ac-hov: #14b8a6;
  --neg: #f87171;
  --pos: #34d399;
  --warn: #fbbf24;
  --shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.55 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  padding: 18px 20px 0;
  max-width: 100%;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-badge {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #0f766e, #14b8a6);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
  box-shadow: var(--shadow);
}
h1 {
  font-size: 20px;
  margin: 0;
  letter-spacing: -.02em;
  font-weight: 800;
}
.sub-brand {
  font-size: 12px;
  color: var(--mut);
  font-weight: 500;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pill-btn {
  background: var(--sf);
  border: 1px solid var(--ln);
  color: var(--ink);
  padding: 7px 12px;
  border-radius: 8px;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow);
  transition: all 0.15s ease;
}
.pill-btn:hover { border-color: var(--ac); color: var(--ac); }
.pill-btn.demo { background: rgba(15, 118, 110, 0.08); border-color: var(--ac); color: var(--ac); }

nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--ln);
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--mut);
  padding: 10px 14px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
nav button:hover { color: var(--ink); }
nav button[aria-selected=true] {
  color: var(--ac);
  border-color: var(--ac);
}
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
main {
  max-width: 100%;
  margin: auto;
  padding: 18px 20px 40px;
}
.bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
  margin-bottom: 16px;
}
label {
  font-size: 12.5px;
  color: var(--mut);
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-weight: 600;
}
input, select {
  font: inherit;
  padding: 8px 11px;
  border: 1px solid var(--ln);
  border-radius: 8px;
  background: var(--sf);
  color: var(--ink);
  min-width: 0;
  transition: border-color 0.15s;
}
input:focus, select:focus { border-color: var(--ac); }
.btn {
  background: var(--ac);
  color: #fff;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 9px 16px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity 0.15s, transform 0.1s;
}
:root[data-theme="dark"] .btn { color: #091312; }
.btn:hover { opacity: 0.92; }
.btn:active { transform: translateY(1px); }
.btn.alt {
  background: var(--sf);
  color: var(--ink);
  border: 1px solid var(--ln);
}
.btn.alt:hover { border-color: var(--ac); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.kpi {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--ac);
}
.kpi span { font-size: 12px; color: var(--mut); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
.kpi b { display: block; font-size: 21px; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi small { color: var(--mut); font-size: 12px; display: block; margin-top: 2px; }

.panel {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
h2 {
  font-size: 15.5px;
  margin: 0 0 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.grid2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
}
.scroll { overflow-x: auto; }
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}
th, td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--ln);
  text-align: right;
  white-space: nowrap;
}
th {
  background: var(--sf2);
  color: var(--mut);
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
th:first-child, td:first-child { text-align: left; }
tbody tr:hover td { background: var(--sf2); }
tr.g td { font-weight: 700; background: var(--bg); }
tr.t td { font-weight: 700; border-top: 2px solid var(--ink); }
.neg { color: var(--neg); }
.pos { color: var(--pos); }
.warn { color: var(--warn); }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 700;
}
.badge.ok { background: rgba(15, 118, 110, 0.14); color: var(--pos); }
.badge.no { background: rgba(197, 48, 48, 0.14); color: var(--neg); }
.badge.wn { background: rgba(217, 119, 6, 0.15); color: var(--warn); }

.form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 12px;
  align-items: end;
}
.x {
  background: none;
  border: 0;
  color: var(--neg);
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 6px;
}
.x:hover { background: rgba(197, 48, 48, 0.1); }
.empty { color: var(--mut); padding: 18px 0; text-align: center; font-style: italic; }

/* Full-Face / Full-Width Tabel Daftar Jurnal Umum (Tanpa Scroll Samping) */
.panel-jurnal-full {
  overflow-x: visible;
  padding: 14px 14px;
}
.tbl-jurnal {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: clamp(11px, 1.02vw, 12.8px);
}
.tbl-jurnal th,
.tbl-jurnal td {
  padding: 6px 5px;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
  vertical-align: top;
  line-height: 1.35;
}
.tbl-jurnal th {
  font-size: clamp(10px, 0.92vw, 11.5px);
  letter-spacing: 0.01em;
  vertical-align: middle;
}
.tbl-jurnal th:nth-child(1), .tbl-jurnal td:nth-child(1) { width: 3%; text-align: center; }
.tbl-jurnal th:nth-child(2), .tbl-jurnal td:nth-child(2) { width: 7.5%; text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl-jurnal th:nth-child(3), .tbl-jurnal td:nth-child(3) { width: 7.5%; text-align: left; font-size: clamp(10.5px, 0.95vw, 12px); }
.tbl-jurnal th:nth-child(4), .tbl-jurnal td:nth-child(4) { width: 5.2%; text-align: left; font-size: clamp(10.5px, 0.95vw, 12px); }
.tbl-jurnal th:nth-child(5), .tbl-jurnal td:nth-child(5) { width: 8.3%; text-align: left; color: var(--mut); }
.tbl-jurnal th:nth-child(6), .tbl-jurnal td:nth-child(6) { width: 13.5%; text-align: left; font-weight: 600; }
.tbl-jurnal th:nth-child(7), .tbl-jurnal td:nth-child(7) { width: 5.8%; text-align: center; white-space: nowrap; }
.tbl-jurnal th:nth-child(8), .tbl-jurnal td:nth-child(8) { width: 17.2%; text-align: left; }
.tbl-jurnal th:nth-child(9), .tbl-jurnal td:nth-child(9) { width: 9%; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl-jurnal th:nth-child(10), .tbl-jurnal td:nth-child(10) { width: 9%; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tbl-jurnal th:nth-child(11), .tbl-jurnal td:nth-child(11) { width: 9%; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
.tbl-jurnal th:nth-child(12), .tbl-jurnal td:nth-child(12) { width: 5%; text-align: center; }
.tbl-jurnal code {
  font-size: clamp(10px, 0.92vw, 11.5px);
  background: var(--sf2);
  padding: 1px 4px;
  border-radius: 4px;
}
.tbl-jurnal .badge {
  padding: 2px 5px;
  font-size: 10px;
}
.tbl-jurnal .x {
  padding: 2px 5px;
  font-size: 11px;
}

/* Executive Dashboard Styles */
.db h1 {
  color: #d0021b;
  font-size: clamp(20px, 3.5vw, 30px);
  margin: 0;
  letter-spacing: .01em;
  font-weight: 800;
}
:root[data-theme="dark"] .db h1 { color: #ff5a6e; }
.db .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 14px;
  background: var(--sf);
  padding: 14px 18px;
  border-radius: 10px;
  border: 1px solid var(--ln);
  box-shadow: var(--shadow);
}
.db .fl {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid #f26b3a;
  border-radius: 8px;
  padding: 0 12px 0 0;
  background: var(--sf);
  overflow: hidden;
}
.db .fl > svg {
  background: #f26b3a;
  padding: 11px;
  box-sizing: content-box;
  flex-shrink: 0;
}
.db .fl label {
  flex-direction: row;
  align-items: center;
  gap: 6px;
  color: var(--ink);
  font-weight: 700;
  font-size: 13px;
}
.db .fl select {
  border: 0;
  font-weight: 800;
  padding: 7px 4px;
  background: transparent;
  cursor: pointer;
}
.db .dc {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  min-width: 0;
  padding-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.db .dh {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  border-bottom: 3px solid #d0021b;
  font-weight: 700;
  font-size: 15px;
}
.db .dh span { padding: 10px 14px; }
.db i.ob, .db .dh i, .db .hb i {
  width: 40px;
  background: #f26b3a;
  display: block;
  flex-shrink: 0;
}
.db .hb {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
}
.db .hb span { padding: 9px 14px; }
.db .dn {
  text-align: center;
  font-style: italic;
  font-size: 11.5px;
  color: var(--mut);
  padding: 6px 0 2px;
}
.db .dv {
  text-align: center;
  font-size: clamp(23px, 2.8vw, 33px);
  font-weight: 800;
  padding: 8px 10px;
  font-variant-numeric: tabular-nums;
}
.db .df {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 14px 2px;
  font-style: italic;
  font-size: 12.5px;
  font-weight: 600;
  margin-top: auto;
}
.db .df b {
  border: 1px dashed var(--mut);
  padding: 3px 10px;
  border-radius: 5px;
  font-style: normal;
  min-width: 68px;
  text-align: center;
}
.db .k4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.db .cf {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 12px;
  padding: 10px 14px;
  font-weight: 700;
  font-size: 13.5px;
}
.db .cf b {
  text-align: right;
  font-size: 15.5px;
  font-variant-numeric: tabular-nums;
}
.db .gr {
  display: grid;
  grid-template-columns: minmax(0, 1.9fr) minmax(0, 1.1fr);
  gap: 14px;
}
@media(max-width: 840px) {
  .db .gr { grid-template-columns: minmax(0, 1fr); }
}
.db .lg {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  justify-content: center;
  font-size: 12px;
  padding: 4px 10px;
}
.db .lg i {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 2px;
  margin-right: 5px;
}
.db .bu {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: center;
  justify-content: center;
  padding: 10px 14px;
}
.db .dv2 { display: block; font-size: 22px; margin: 2px 0 10px; font-weight: 800; }
.db .lg2 { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.db .lg2 i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; }
.db .lg2 b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.db svg text { font-size: 10px; }

/* Financial Reports (Laba Rugi, Neraca, Arus Kas) */
.rl { max-width: 820px; margin: 0 auto 16px; }
.rl h2 { text-align: center; font-size: 18px; margin: 0; justify-content: center; }
.rl .per { text-align: center; color: var(--mut); font-size: 13px; margin-bottom: 14px; }
.rl td { text-align: left; border: 0; padding: 5px 8px; }
.rl .nm { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rl .kd { width: 90px; color: var(--mut); font-family: ui-monospace, monospace; font-size: 12.5px; }
.rl .sh td { font-weight: 800; padding-top: 18px; text-transform: uppercase; color: var(--ac); letter-spacing: 0.03em; }
.rl .tt td { font-weight: 700; border-top: 1.5px solid var(--ink); padding-top: 7px; }
.rl .big td { font-weight: 800; background: var(--sf2); padding: 10px 8px; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); font-size: 14.5px; }
.rl .sb td { font-weight: 700; padding-top: 14px; }
.rl .sb .nm { font-weight: 600; }

.jl {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}
@media(max-width: 560px) {
  .jl { grid-template-columns: 1fr 1fr; }
  .jl .ja { grid-column: 1 / -1; }
}
svg text { fill: var(--mut); font-size: 11px; }

.toast-banner {
  background: var(--sf);
  border-left: 4px solid var(--ac);
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
  font-size: 13.5px;
}

/* Compact & Sticky Table Styles untuk Kartu Persediaan */
.tbl-compact {
  font-size: 12.5px;
}
.tbl-compact th, .tbl-compact td {
  padding: 6px 7px;
}
.sticky-col-right {
  position: sticky;
  right: 0;
  background: var(--sf);
  z-index: 3;
  box-shadow: -2px 0 5px rgba(0,0,0,0.04);
}
th.sticky-col-right {
  background: var(--sf2);
  z-index: 4;
}
tr:hover .sticky-col-right {
  background: var(--sf2);
}
.cell-sku-nama {
  max-width: 200px;
  min-width: 150px;
  white-space: normal;
  word-break: break-word;
  line-height: 1.3;
}
.cell-sku-nama b {
  display: inline-block;
  font-size: 12px;
  color: var(--ink);
}
.cell-sku-nama small {
  display: block;
  font-size: 11px;
  color: var(--mut);
  margin-top: 2px;
}

@media print {
  header, .bar, .no-print, #gd-wrap { display: none !important; }
  body { background: #fff; color: #000; }
  main { max-width: 100%; padding: 0; }
  .panel { border: 0; box-shadow: none; padding: 0; }
}
tbody tr:hover td { background: color-mix(in srgb, var(--ac) 6%, transparent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { header nav, .no-print { display: none !important; } }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-badge">E</div>
      <div>
        <h1>Keuangan Toko Online</h1>
        <div class="
